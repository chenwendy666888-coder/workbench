    case 'import': document.getElementById('importInput').click(); break;
    case 'clear': if(confirm('确定清空所有数据并恢复初始示例？此操作不可撤销。')){ store=seed(); save(); refresh(); } break;
    case 'close-modal': closeModal(); break;
  }
}
function handleChange(el){
  const a=el.dataset.action;
  if(a==='toggle-todo'){ const t=store.todos.find(x=>x.id===el.dataset.id); if(t){ t.done=el.checked; t.doneAt=t.done?now():null; save(); refresh(); } }
  else if(a==='set-app-status'){ const x=store.applications.find(p=>p.id===el.dataset.id); if(x){ x.status=el.value; save(); refresh(); } }
  else if(a==='toggle-backlog'){ const b=store.backlog.find(x=>x.id===el.dataset.id); if(b){ b.done=el.checked; save(); refresh(); } }
  else if(a==='set-togo-status'){ const p=store.togo.find(x=>x.id===el.dataset.id); if(p){ p.status=el.value; save(); refresh(); } }
  else if(a==='toggle-sub'){ const p=store.togo.find(x=>x.id===el.dataset.pid); if(p){ const s=p.subs.find(y=>y.id===el.dataset.id); if(s){ s.done=el.checked; save(); refresh(); } } }
  else if(a==='toggle-idea-step'){ const b=store.backlog.find(x=>x.id===el.dataset.bid); if(b&&b.idea){ const s=b.idea.steps.find(s=>s.id===el.dataset.sid); if(s){ s.done=el.checked; save(); renderBacklog(); } } }
  else if(a==='toggle-idea-sub'){ const b=store.backlog.find(x=>x.id===el.dataset.bid); if(b&&b.idea){ const s=b.idea.steps.find(s=>s.id===el.dataset.sid); if(s){ const x=s.subs.find(y=>y.id===el.dataset.xid); if(x){ x.done=el.checked; save(); renderBacklog(); } } } }
  else if(a==='idea-field'){ const b=store.backlog.find(x=>x.id===el.dataset.bid); if(b){ const d=ideaEnsure(b); d[el.dataset.field]=el.value; save(); } }
}
function handleSubmit(f){
  const v={}; new FormData(f).forEach((val,k)=>v[k]=val);
  if(f.dataset.form==='add-todo'){ if(!v.text.trim())return; store.todos.push({id:uid(),text:v.text.trim(),ddl:v.ddl||'',scope:v.scope||'week',done:false,createdAt:now()}); save(); refresh(); }
  else if(f.dataset.form==='add-thought'){ let tx=(v.text||'').trim(); if(!tx) return;
    const mT=tx.match(/^\s*(todo|待办)\s*[:：]\s*([\s\S]+)/i);
    const mI=tx.match(/^\s*(idea|想法)\s*[:：]\s*([\s\S]+)/i);
    if(mT){ store.todos.push({id:uid(),text:mT[2].trim(),ddl:'',scope:'week',done:false,createdAt:now()}); }
    else if(mI){ store.backlog.unshift({id:uid(),text:mI[2].trim(),kind:'想法',link:'',done:false,at:now(),expanded:true,idea:{why:'',goal:'',steps:[],links:[],status:'想法'}}); }
    else { store.thoughts.unshift({id:uid(),text:tx,at:now()}); }
    save(); refresh(); }
  else if(f.dataset.form==='add-sub'){ const p=store.togo.find(x=>x.id===f.dataset.id); if(p&&(v.text||'').trim()){ p.subs.push({id:uid(),text:v.text.trim(),done:false}); save(); refresh(); } }
  else if(f.dataset.form==='add-idea-step'){ const b=store.backlog.find(x=>x.id===f.dataset.bid); if(b&&(v.text||'').trim()){ const d=ideaEnsure(b); d.steps.push({id:uid(),text:v.text.trim(),done:false,subs:[]}); save(); renderBacklog(); } return; }
  else if(f.dataset.form==='add-idea-sub'){ const b=store.backlog.find(x=>x.id===f.dataset.bid); if(b&&b.idea&&(v.text||'').trim()){ const s=b.idea.steps.find(s=>s.id===f.dataset.sid); if(s){ s.subs.push({id:uid(),text:v.text.trim(),done:false}); save(); renderBacklog(); } } return; }
  f.reset();
}

/* file upload */
const fileInput=document.getElementById('fileInput');
function openUpload(target){ fileInput.dataset.target=target; fileInput.click(); }
const folderInput=document.getElementById('folderInput');
function openUploadFolder(target){ folderInput.dataset.target=target; folderInput.click(); }
folderInput.addEventListener('change',async e=>{
  const files=[...e.target.files]; if(!files.length) return;
  const target=folderInput.dataset.target;
  const dest = target==='global'? store.materials : (store.applications.find(x=>x.id===target)||{}).materials;
  if(!dest){ folderInput.value=''; return; }
  for(const file of files){
    const id=uid(); await filePut(id,file);
    dest.push({id,name:(file.webkitRelativePath||file.name),fileId:id,addedAt:now()});
  }
  save(); refresh(); folderInput.value='';
});
fileInput.addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  const target=fileInput.dataset.target;
  const id=uid(); await filePut(id,file);
  const rec={id,name:file.name,fileId:id,addedAt:now()};
  if(target==='global') store.materials.push(rec);
  else { const ap=store.applications.find(x=>x.id===target); if(ap) ap.materials.push(rec); }
  save(); refresh(); fileInput.value='';
});

/* export / import */
function exportData(){
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='workbench-backup-'+todayStr()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  const m=loadMeta(); m.lastExport=now(); saveMeta(m); renderExportNudge();
}
function mdDate(ts){ try{ const d=new Date(ts); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }catch(e){ return ''; } }
function exportMarkdown(){
  const today=todayStr(); const lines=[];
  // 顶部 frontmatter：Obsidian 认；Notion 导入时忽略也无妨
  lines.push('---'); lines.push('title: 工作台笔记 '+today); lines.push('created: '+today); lines.push('tags: [工作台]'); lines.push('---',''); 
  lines.push('# 工作台笔记 · '+today,'');

  // 想法卡
  const ideas=(store.backlog||[]).filter(b=>b.kind==='想法');
  if(ideas.length){ lines.push('## 💡 想法',''); ideas.forEach(b=>{ const d=b.idea||{};
    lines.push('### '+(b.text||'未命名想法'));
    const meta=[]; if(d.status) meta.push('状态：'+d.status); const dt=mdDate(b.at); if(dt) meta.push('记于：'+dt);
    if(meta.length) lines.push('`'+meta.join(' ｜ ')+'`  #想法');
    if(d.why) lines.push('','**为什么想做：** '+d.why);
    if(d.goal) lines.push('','**做成什么算完成：** '+d.goal);
    if(Array.isArray(d.steps)&&d.steps.length){ lines.push('','**步骤：**');
      d.steps.forEach(s=>{ lines.push('- ['+(s.done?'x':' ')+'] '+s.text);
        (s.subs||[]).forEach(x=>lines.push('    - ['+(x.done?'x':' ')+'] '+x.text)); }); }
    if(Array.isArray(d.links)&&d.links.length){ lines.push('','**链接：** '+d.links.map(l=>'['+l.name+']('+l.url+')').join('　')); }
    lines.push(''); }); }

  // 随手小记
  if((store.thoughts||[]).length){ lines.push('## 📝 随手小记','');
    store.thoughts.forEach(t=>{ const dt=mdDate(t.at); lines.push('- '+(dt?('**'+dt+'** — '):'')+(t.text||'').replace(/\n/g,' ')); });
    lines.push(''); }

  // 想做 & 在读（非想法的 backlog）
  const bl=(store.backlog||[]).filter(b=>b.kind!=='想法');
  if(bl.length){ lines.push('## ❏ 想做 & 在读','');
    bl.forEach(b=>{ lines.push('- ['+(b.done?'x':' ')+'] '+b.text+(b.kind?'  #'+b.kind:'')+(b.link?' — ['+b.link+']('+b.link+')':'')); });
    lines.push(''); }

  const md=lines.join('\n');
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='工作台笔记-'+today+'.md'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}
document.getElementById('importInput').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
    if(data&&typeof data==='object'){ for(const k in data) store[k]=data[k];
      const base=seed(); for(const k in base){ if(!(k in store)) store[k]=base[k]; } save(); refresh(); alert('导入成功'); }
    }catch(err){ alert('导入失败：文件格式不正确'); } };
  r.readAsText(file); e.target.value='';
});

/* listeners */
document.addEventListener('click',e=>{ const b=e.target.closest('[data-action]'); if(b){ handleClick(b); } });
document.addEventListener('change',e=>{ const el=e.target.closest('[data-action]'); if(el) handleChange(el); });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form]'); if(f){ e.preventDefault(); handleSubmit(f); } });
document.getElementById('nav').addEventListener('click',e=>{ const n=e.target.closest('.nav-item'); if(n) switchView(n.dataset.view); });
/* 点空白不再关闭：只有「取消/关闭」按钮或 Esc 才关 */
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
/* 待办滑动完成：触摸/指针左右滑一张待办即切换完成 */
(function(){
  let row=null,sx=0,sy=0,active=false,moved=0;
  function down(e){ const t=e.target.closest('.todo'); if(!t||!t.dataset.tid) return;
    if(e.target.closest('input,button,a')) return;
    row=t; sx=e.clientX; sy=e.clientY; active=true; moved=0; row.classList.add('swiping'); row.classList.remove('swipe-anim'); }
  function move(e){ if(!active||!row) return; const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dy)>Math.abs(dx)+10){ cancel(); return; }
    moved=dx; row.style.transform='translateX('+dx+'px)'; row.style.opacity=String(Math.max(.35,1-Math.abs(dx)/240)); if(e.cancelable&&Math.abs(dx)>6) e.preventDefault(); }
  function up(){ if(!active||!row) return; const r=row; active=false; r.classList.remove('swiping'); r.classList.add('swipe-anim');
    if(Math.abs(moved)>70){ const t=store.todos.find(x=>x.id===r.dataset.tid);
      r.style.transform='translateX('+(moved>0?400:-400)+'px)'; r.style.opacity='0';
      if(t){ t.done=!t.done; if(t.done) t.doneAt=now(); save(); }
      setTimeout(()=>refresh(),160); }
    else { r.style.transform=''; r.style.opacity=''; }
    row=null; }
  function cancel(){ if(row){ row.classList.remove('swiping'); row.style.transform=''; row.style.opacity=''; } active=false; row=null; }
  document.addEventListener('pointerdown',down); document.addEventListener('pointermove',move,{passive:false}); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',cancel);
})();
/* 小窗口可拖动（抓标题栏 h3） */
(function(){
  const modal=document.getElementById('modal'); if(!modal) return;
  let box=null,sx=0,sy=0,ox=0,oy=0,drag=false;
  function start(e){ const t=e.touches?e.touches[0]:e; const h=(e.target.closest?e.target.closest('.modal-box h3'):null); if(!h) return;
    box=document.getElementById('modal-body'); const r=box.getBoundingClientRect();
    box.style.position='fixed'; box.style.margin='0'; box.style.left=r.left+'px'; box.style.top=r.top+'px';
    ox=r.left; oy=r.top; sx=t.clientX; sy=t.clientY; drag=true; if(e.cancelable) e.preventDefault(); }
  function move(e){ if(!drag||!box) return; const t=e.touches?e.touches[0]:e;
    box.style.left=Math.max(4,ox+t.clientX-sx)+'px'; box.style.top=Math.max(4,oy+t.clientY-sy)+'px'; if(e.cancelable) e.preventDefault(); }
  function end(){ drag=false; }
  modal.addEventListener('mousedown',start); document.addEventListener('mousemove',move); document.addEventListener('mouseup',end);
  modal.addEventListener('touchstart',start,{passive:false}); document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',end);
})();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(_clockTimer){ clearInterval(_clockTimer); _clockTimer=null; } }
  else { startClock(); }
});

/* ===== command palette + hotkeys ===== */
const VIEW_ORDER=['workbench','websites','templates','applications','prep','todos','stats','review','backlog','toolkit'];
const VIEW_EMO={workbench:'◉',websites:'◈',templates:'▤',applications:'⊞',prep:'◆',todos:'✓',stats:'▥',review:'⟳',backlog:'❏',toolkit:'◇'};
let _cmdkItems=[],_cmdkSel=0;
function buildCommands(){
  const cmds=[];
  VIEW_ORDER.forEach((v,i)=> cmds.push({emo:VIEW_EMO[v],label:TITLES[v][1],hint:(i+1)+'',run:()=>switchView(v)}));
  store.quicklinks.forEach(q=>{
    if(q.url) cmds.push({emo:'▸',label:'打开 '+q.name,hint:/^https?:/i.test(q.url)?'网页':'App',run:()=>openLink(q.url)});
    (q.children||[]).forEach(c=> cmds.push({emo:'▸',label:'打开 '+q.name+' · '+c.name,hint:/^https?:/i.test(c.url)?'网页':'App',run:()=>openLink(c.url)}));
  });
  cmds.push({emo:'✎',label:'新建待办',hint:'',run:()=>{ switchView('todos'); setTimeout(()=>{ const el=document.querySelector('#view-todos input[name=text]'); if(el) el.focus(); },60); }});
  cmds.push({emo:'✦',label:'随手小记',hint:'',run:()=>{ switchView('todos'); setTimeout(()=>{ const el=document.querySelector('#view-todos textarea[name=text]'); if(el) el.focus(); },60); }});
  cmds.push({emo:'⛊',label:'备份 & 恢复',hint:'',run:()=>openBackup()});
  cmds.push({emo:'⬇',label:'导出备份 JSON',hint:'',run:()=>exportData()});
  cmds.push({emo:'◐',label:'切换 夜视 / 护眼',hint:'',run:()=>applyTheme(document.documentElement.getAttribute('data-theme')==='pixel'?'day':'pixel')});
  return cmds;
}
function openLink(url){ if(!url) return; if(/^https?:/i.test(url)) window.open(url,'_blank','noopener'); else location.href=url; }
function openCmdk(){
  _cmdkItems=buildCommands(); _cmdkSel=0;
  document.getElementById('cmdk').classList.remove('hidden');
  const inp=document.getElementById('cmdk-input'); inp.value=''; renderCmdk(''); inp.focus();
}
function closeCmdk(){ document.getElementById('cmdk').classList.add('hidden'); }
function renderCmdk(q){
  q=(q||'').trim().toLowerCase();
  const list=q? _cmdkItems.filter(c=>c.label.toLowerCase().includes(q)) : _cmdkItems;
  _cmdkFiltered=list; if(_cmdkSel>=list.length) _cmdkSel=0;
  const el=document.getElementById('cmdk-list');
  el.innerHTML = list.length? list.map((c,i)=>'<div class="cmdk-item'+(i===_cmdkSel?' sel':'')+'" data-ci="'+i+'">'+
    '<span class="ci-emo">'+c.emo+'</span><span class="ci-lab">'+esc(c.label)+'</span>'+
    (c.hint?'<span class="ci-hint">'+esc(c.hint)+'</span>':'')+'</div>').join('')
    : '<div class="cmdk-empty">没有匹配项</div>';
}
let _cmdkFiltered=[];
function runCmdk(i){ const c=_cmdkFiltered[i]; if(c){ closeCmdk(); c.run(); } }
document.getElementById('cmdk-input').addEventListener('input',e=>renderCmdk(e.target.value));
document.getElementById('cmdk-list').addEventListener('click',e=>{ const it=e.target.closest('[data-ci]'); if(it) runCmdk(+it.dataset.ci); });
document.getElementById('cmdk-input').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); _cmdkSel=Math.min(_cmdkSel+1,_cmdkFiltered.length-1); renderCmdk(document.getElementById('cmdk-input').value); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); _cmdkSel=Math.max(_cmdkSel-1,0); renderCmdk(document.getElementById('cmdk-input').value); }
  else if(e.key==='Enter'){ e.preventDefault(); runCmdk(_cmdkSel); }
});
document.getElementById('cmdk').addEventListener('click',e=>{ if(e.target.id==='cmdk') closeCmdk(); });
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  const cmdkOpen=!document.getElementById('cmdk').classList.contains('hidden');
  if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){ e.preventDefault(); cmdkOpen?closeCmdk():openCmdk(); return; }
  if(cmdkOpen){ if(e.key==='Escape') closeCmdk(); return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); openCmdk(); return; }
  if(/^[1-9]$/.test(e.key)){ const i=+e.key-1; if(i<VIEW_ORDER.length) switchView(VIEW_ORDER[i]); }
});

/* init */
startClock();
renderFeed();
renderExportNudge();
switchView('workbench');
