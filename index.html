<style>
/* ============ THEME TOKENS ============ */
[data-theme="pixel"]{
  --bg:#0E141B; --surface:#151D26; --surface-2:#0F1620; --sunken:#0B1119;
  --ink:#E6EDF3; --muted:#8B98A6; --faint:#5A6672;
  --accent:#2FB8C6; --accent-soft:#12303A; --accent-line:#1E4A56;
  --amber:#F5A623; --green:#34D399; --red:#FB6A6A;
  --pink:#F58AB4; --pink-soft:#341E29; --pink-line:#6E3A50;
  --border:#223040; --border-2:#2C3E50;
  --f-display:'Press Start 2P',monospace;
  --f-pixel:'Press Start 2P',monospace;
  --f-body:'IBM Plex Mono',ui-monospace,monospace;
  --f-data:'JetBrains Mono',ui-monospace,monospace;
  --f-ui:'IBM Plex Mono',ui-monospace,monospace;
  --radius:3px; --hard:1;
  --shadow:4px 4px 0 0 rgba(0,0,0,.5);
  --shadow-sm:2px 2px 0 0 rgba(0,0,0,.5);
  --glow:0 0 0 1px var(--accent-line),0 0 22px -6px rgba(47,184,198,.55);
}
[data-theme="day"]{
  --bg:#F1EEE2; --surface:#FBFAF3; --surface-2:#F5F1E5; --sunken:#EAE5D5;
  --ink:#25302A; --muted:#697A6D; --faint:#9BA79D;
  --accent:#2F7D5E; --accent-soft:#E3EEE7; --accent-line:#BCD8C8;
  --amber:#B8720C; --green:#1E8A5B; --red:#B23A48;
  --pink:#C77490; --pink-soft:#F5E4EC; --pink-line:#E6C2D2;
  --border:#DDD8C6; --border-2:#CDC7B2;
  --f-display:'Newsreader',Georgia,serif;
  --f-pixel:'IBM Plex Mono',ui-monospace,monospace;
  --f-body:'Inter',system-ui,-apple-system,sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,monospace;
  --f-ui:'Inter',system-ui,-apple-system,sans-serif;
  --radius:12px; --hard:0;
  --shadow:0 1px 2px rgba(40,60,40,.05),0 10px 26px -12px rgba(40,60,40,.22);
  --shadow-sm:0 1px 2px rgba(40,60,40,.06);
  --glow:0 1px 2px rgba(40,60,40,.05),0 12px 30px -14px rgba(47,125,94,.35);
}

/* ============ BASE ============ */
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;display:flex;font-family:var(--f-body);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:13.5px;line-height:1.6;letter-spacing:.01em;}
::selection{background:var(--accent);color:var(--bg);}
.crt{position:fixed;inset:0;pointer-events:none;z-index:9998;}
[data-theme="pixel"] .crt{background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.55;}
[data-theme="pixel"] .crt::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 120% at 50% -10%,transparent 62%,rgba(0,0,0,.4));}
[data-theme="day"] .crt{display:none;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* eyebrow — the pixel section-number signature */
.eyebrow{font-family:var(--f-pixel);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);line-height:1.5;}
[data-theme="day"] .eyebrow{font-size:10px;letter-spacing:.16em;font-weight:600;}

/* ============ SIDEBAR ============ */
.sidebar{width:214px;flex:0 0 214px;height:100vh;position:sticky;top:0;
  background:var(--surface-2);border-right:2px solid var(--border);
  display:flex;flex-direction:column;padding:16px 14px;z-index:5;overflow:hidden;}
.side-blank{flex:1 1 44%;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px;}
.pet{width:104px;height:104px;max-width:100%;border:none;background:transparent;cursor:pointer;padding:0;line-height:0;transition:opacity .2s,transform .1s;}
.pet:hover{transform:translateY(-2px);}
.pet img,.pet svg{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
.pet-op{width:78%;max-width:130px;accent-color:var(--pink);cursor:pointer;height:auto;padding:0;border:none;background:transparent;}
.pet-op:focus{box-shadow:none;}
.side-dock{flex:1 1 56%;min-height:0;display:flex;flex-direction:column;
  border-top:2px solid var(--border);padding-top:14px;}
.side-dock-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex:none;}
.dock-clock{font-family:var(--f-pixel);font-size:11px;color:var(--accent);letter-spacing:.03em;
  text-shadow:0 0 10px rgba(47,184,198,.4);margin-top:5px;}
[data-theme="day"] .dock-clock{font-family:var(--f-data);font-weight:700;font-size:14px;color:var(--ink);text-shadow:none;}
.side-panel{margin-top:auto;padding-top:18px;}
.side-top{display:flex;align-items:center;gap:11px;margin-bottom:20px;}
.sp-clock{font-family:var(--f-pixel);font-size:15px;color:var(--accent);letter-spacing:.04em;text-shadow:0 0 12px rgba(47,184,198,.45);}
[data-theme="day"] .sp-clock{font-family:var(--f-data);font-weight:700;font-size:20px;color:var(--ink);text-shadow:none;}
.sp-date{font-family:var(--f-data);font-size:10.5px;color:var(--muted);margin-top:5px;}
.sp-stats{display:flex;gap:8px;margin:13px 0;}
.sp-stat{flex:1;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:8px 9px;}
.sp-stat b{display:block;font-family:var(--f-data);font-weight:700;font-size:16px;color:var(--accent);line-height:1.1;}
.sp-stat span{font-size:9.5px;color:var(--muted);font-family:var(--f-data);letter-spacing:.02em;}
.sp-cap-label{font-family:var(--f-pixel);font-size:7.5px;color:var(--pink);letter-spacing:.08em;margin-bottom:6px;}
[data-theme="day"] .sp-cap-label{font-family:var(--f-data);font-size:10px;font-weight:600;}
.sp-capture textarea{min-height:44px;resize:vertical;font-size:12px;padding:7px 9px;}
.sp-capture .btn{width:100%;margin-top:7px;}
.avatar{flex:none;width:40px;height:40px;padding:3px;border:2px solid var(--pink-line);
  background:var(--pink-soft);border-radius:var(--radius);cursor:pointer;line-height:0;
  box-shadow:var(--shadow-sm);transition:.12s;overflow:hidden;}
.avatar:hover{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink-line),0 0 16px -4px var(--pink);}
.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;border-radius:1px;}
.avatar svg{image-rendering:pixelated;}
.side-id{min-width:0;}
.brand{font-family:var(--f-display);font-size:11px;line-height:1.5;color:var(--ink);margin:0;}
[data-theme="day"] .brand{font-size:19px;font-weight:600;}
.brand .cur{color:var(--accent);animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.brand-sub{font-family:var(--f-pixel);font-size:7.5px;color:var(--muted);margin:6px 4px 20px;letter-spacing:.1em;}
[data-theme="day"] .brand-sub{font-size:10px;}
.nav{display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:3px;}
.nav::-webkit-scrollbar{width:7px;}
.nav::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:var(--radius);}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;color:var(--muted);
  cursor:pointer;border:1px solid transparent;background:transparent;font-family:var(--f-ui);
  font-size:13px;text-align:left;width:100%;border-radius:var(--radius);transition:.12s;}
.nav-item:hover{color:var(--ink);border-color:var(--border);background:var(--surface);}
.nav-item.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);font-weight:600;}
[data-theme="pixel"] .nav-item.active{box-shadow:inset 2px 2px 0 rgba(0,0,0,.3);}
.nav-item .emo{width:18px;text-align:center;font-size:14px;flex:none;}
.nav-item .lab{font-size:12.5px;}
.side-foot{margin-top:auto;font-family:var(--f-pixel);font-size:7px;color:var(--faint);line-height:1.9;letter-spacing:.06em;}
[data-theme="day"] .side-foot{font-size:9.5px;font-family:var(--f-data);}
.theme-toggle{display:flex;gap:0;margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.theme-toggle button{flex:1;padding:8px 4px;background:var(--surface);border:none;color:var(--muted);
  font-family:var(--f-pixel);font-size:7.5px;letter-spacing:.06em;cursor:pointer;transition:.12s;}
[data-theme="day"] .theme-toggle button{font-family:var(--f-data);font-size:10px;font-weight:600;}
.theme-toggle button.on{background:var(--accent);color:var(--bg);}
.theme-toggle button:not(.on):hover{color:var(--ink);}

/* ============ MAIN ============ */
.main{flex:1;height:100vh;overflow:auto;padding:22px 30px 70px;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.topbar h1{font-family:var(--f-display);font-size:16.5px;line-height:1.5;margin:8px 0 0;color:var(--ink);}
[data-theme="day"] .topbar h1{font-size:26px;font-weight:600;margin:2px 0 0;}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:8px;}
.tools{display:flex;gap:7px;flex-wrap:wrap;padding-top:4px;}
section.view{display:none;}
section.view.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.view-head h2{font-family:var(--f-display);font-size:15px;margin:0;color:var(--ink);}
[data-theme="day"] .view-head h2{font-size:20px;font-weight:600;}
.view-head .titlewrap{display:flex;flex-direction:column;gap:7px;}

/* ============ BUTTONS / INPUTS ============ */
.btn{font-family:var(--f-ui);font-size:12px;font-weight:600;padding:8px 13px;border-radius:var(--radius);
  border:1px solid var(--border-2);background:var(--surface);color:var(--ink);cursor:pointer;
  box-shadow:var(--shadow-sm);transition:.1s;}
.btn:hover{border-color:var(--accent-line);color:var(--accent);}
.btn:active{transform:translate(2px,2px);box-shadow:none;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.btn.primary:hover{filter:brightness(1.08);color:var(--bg);}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);}
.btn.ghost:hover{color:var(--ink);background:var(--surface);}
.btn.sm{padding:5px 9px;font-size:11px;}
.icon-btn{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;
  padding:3px 6px;border-radius:var(--radius);line-height:1;font-family:var(--f-data);}
.icon-btn:hover{background:var(--accent-soft);color:var(--red);}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-family:var(--f-data);
  font-size:11px;padding:0;letter-spacing:.02em;}
.linkbtn:hover{text-decoration:underline;}
input,select,textarea{font-family:var(--f-body);font-size:13.5px;color:var(--ink);background:var(--sunken);
  border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;width:100%;outline:none;transition:.12s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
input::placeholder,textarea::placeholder{color:var(--faint);}
label.field{display:block;margin-bottom:13px;}
label.field>span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-family:var(--f-pixel);
  letter-spacing:.04em;}
[data-theme="day"] label.field>span{font-family:var(--f-ui);font-size:12px;font-weight:500;}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--shadow);}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-title{font-size:15.5px;font-weight:600;color:var(--accent);text-decoration:none;word-break:break-word;font-family:var(--f-ui);}
.card-title:hover{text-decoration:underline;}
.muted{color:var(--muted);}.small{font-size:13px;}
.tiny{font-size:10px;color:var(--faint);font-family:var(--f-data);letter-spacing:.03em;}
.empty{padding:34px 24px;border:1px dashed var(--border-2);border-radius:var(--radius);text-align:center;
  color:var(--muted);background:var(--surface-2);font-size:13.5px;}

/* ============ BADGES ============ */
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:var(--radius);
  font-family:var(--f-data);letter-spacing:.04em;border:1px solid transparent;text-transform:uppercase;}
.badge.week{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
.badge.long{background:transparent;color:var(--amber);border-color:var(--amber);}
.badge.impnu{background:var(--pink-soft);color:var(--pink);border-color:var(--pink-line);}
.badge.ok{background:transparent;color:var(--green);border-color:var(--green);}
.badge.late{background:transparent;color:var(--red);border-color:var(--red);}
.badge.mut{background:var(--sunken);color:var(--muted);border-color:var(--border);}

/* ============ HUD (home top) ============ */
.hud{border:1px solid var(--accent-line);border-radius:var(--radius);background:var(--surface-2);
  padding:14px 16px;margin-bottom:16px;box-shadow:var(--glow);}
.hud-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.hud-clock{font-family:var(--f-data);font-weight:700;font-size:22px;color:var(--ink);letter-spacing:.04em;}
[data-theme="pixel"] .hud-clock{font-family:var(--f-pixel);font-size:15px;color:var(--accent);text-shadow:0 0 14px rgba(47,184,198,.5);}
.hud-date{font-family:var(--f-data);font-size:13px;color:var(--muted);}
.hud-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;}
.hud-stat{font-family:var(--f-data);font-size:12.5px;color:var(--muted);white-space:nowrap;}
.hud-stat b{color:var(--accent);font-weight:700;font-size:14.5px;}
.quicklinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);align-items:flex-start;}
.qgroup{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  box-shadow:var(--shadow-sm);min-width:150px;overflow:hidden;transition:.1s;}
.qgroup.open{border-color:var(--accent-line);}
.qhead{display:flex;align-items:center;gap:6px;padding:7px 9px;}
.qname{color:var(--ink);text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap;}
a.qname:hover{color:var(--accent);text-decoration:underline;}
.qcaret{border:none;background:transparent;color:var(--accent);cursor:pointer;font-family:var(--f-data);
  font-size:11px;padding:1px 4px;display:flex;align-items:center;gap:3px;border-radius:var(--radius);}
.qcaret i{font-style:normal;font-size:9px;background:var(--accent-soft);color:var(--accent);
  padding:0 4px;border-radius:6px;border:1px solid var(--accent-line);}
.qcaret:hover{background:var(--accent-soft);}
.qgroup .x{color:var(--faint);cursor:pointer;font-size:11px;font-family:var(--f-data);padding:0 2px;}
.qgroup .x:hover{color:var(--red);}
.qkids{border-top:1px dashed var(--border);padding:7px 9px;display:flex;flex-direction:column;gap:5px;background:var(--sunken);}
.qkid{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.qkid a{color:var(--pink);text-decoration:none;font-size:11.5px;word-break:break-all;}
.qkid a:hover{text-decoration:underline;}
.qkid-add{align-self:flex-start;border:1px dashed var(--pink-line);background:transparent;color:var(--pink);
  font-family:var(--f-data);font-size:10px;padding:3px 8px;border-radius:var(--radius);cursor:pointer;margin-top:2px;}
.qkid-add:hover{background:var(--pink-soft);}
.qadd{border:1px dashed var(--border-2);background:transparent;color:var(--muted);cursor:pointer;
  font-family:var(--f-ui);font-size:12px;padding:8px 11px;border-radius:var(--radius);align-self:flex-start;}
.qadd:hover{border-color:var(--accent-line);color:var(--accent);}

/* ============ HOME GRID ============ */
.home{display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(300px,.95fr);gap:18px;align-items:start;}
@media(max-width:980px){.home{grid-template-columns:1fr;}}
.panel-label{display:flex;align-items:center;gap:9px;margin:0 0 12px;}
.panel-label .bar{flex:1;height:1px;background:var(--border);}
.home-right{display:flex;flex-direction:column;gap:14px;}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.home-cards{grid-template-columns:1fr;}}
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.hcard-head{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;margin-bottom:9px;gap:8px;}
.hcard-head .nm{font-family:var(--f-ui);font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
.hcard-body{font-size:13.5px;flex:1;min-height:48px;}
.mini{display:flex;flex-direction:column;gap:6px;}
.mini a{color:var(--accent);text-decoration:none;font-size:13px;word-break:break-all;}
.mini a:hover{text-decoration:underline;}
.mini .row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;}

/* quick note */
.quicknote{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);}
.quicknote textarea{min-height:52px;resize:vertical;line-height:1.55;}
.quicknote .qn-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.qn-recent{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto;}
.qn-item{font-size:13px;padding:7px 9px;background:var(--sunken);border-radius:var(--radius);border-left:2px solid var(--accent-line);}
.qn-item .at{font-family:var(--f-data);font-size:9.5px;color:var(--faint);display:block;margin-bottom:2px;letter-spacing:.03em;}

/* ============ TODO ============ */
.todo-add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.todo-add input[name=text]{flex:1;min-width:150px;}
.todo-add input[name=ddl]{width:auto;}
.todo-add select{width:auto;}
.todo-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.todo-left{display:flex;flex-direction:column;gap:18px;}
@media(max-width:760px){.todo-cols{grid-template-columns:1fr;}}
.col h3{font-size:13px;font-family:var(--f-pixel);letter-spacing:.06em;margin:0 0 11px;display:flex;align-items:center;gap:8px;color:var(--ink);}
[data-theme="day"] .col h3{font-family:var(--f-ui);font-size:14px;font-weight:600;}
.col h3 .cnt{font-family:var(--f-data);font-size:11px;color:var(--accent);font-weight:700;}
.col.impnu h3 .cnt{color:var(--pink);}
.col.long h3 .cnt{color:var(--amber);}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface);margin-bottom:8px;transition:.1s;}
.todo:hover{border-color:var(--border-2);}
.todo .cb{flex:0 0 auto;width:16px;height:16px;margin-top:2px;cursor:pointer;accent-color:var(--accent);}
.todo .body{flex:1;min-width:0;}
.todo .tx{word-break:break-word;font-size:14px;}
.todo.done{opacity:.6;}
.todo.done .tx{text-decoration:line-through;color:var(--muted);}
.todo .meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap;}
.todo .ddl{font-family:var(--f-data);font-size:11px;color:var(--muted);}
.todo.urgent{border-left:3px solid var(--red);}
.todo.urgent .ddl{color:var(--red);font-weight:700;}
.todo.soon{border-left:3px solid var(--amber);}
.todo.soon .ddl{color:var(--amber);}
.done-wrap{margin-top:14px;}
.done-wrap summary{cursor:pointer;color:var(--muted);font-size:13px;font-family:var(--f-data);}

/* ============ TEMPLATES ============ */
.cat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px;}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.cat-head h3{margin:0;font-size:15.5px;font-weight:600;font-family:var(--f-ui);color:var(--ink);}
.cat-items{display:flex;flex-direction:column;gap:7px;}
.tpl{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 10px;
  background:var(--sunken);border-radius:var(--radius);}
.tpl a{color:var(--accent);text-decoration:none;font-size:14px;word-break:break-word;}
.tpl a:hover{text-decoration:underline;}
.tpl .meta{font-size:12px;color:var(--muted);margin-top:3px;}

/* ============ APPLICATIONS ============ */
.app-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);margin-bottom:13px;}
.app-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.app-head .nm{font-size:15.5px;font-weight:600;font-family:var(--f-ui);color:var(--ink);}
.app-head .ctl{display:flex;align-items:center;gap:8px;}
.app-head select{width:auto;font-size:11.5px;padding:6px 9px;}
.mat-zone{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px;}
.mat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;
  background:var(--sunken);border-radius:var(--radius);margin-bottom:6px;font-size:13px;}
.mat-item .fn{color:var(--ink);word-break:break-all;}
.mat-actions{display:flex;gap:4px;flex:none;}

/* ============ PREP (segmented pixel bars) ============ */
.prep-overall{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.prep-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:10px;}
.prep-item .pi-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
.prep-item .nm{font-size:15px;font-weight:600;font-family:var(--f-ui);color:var(--ink);}
.prep-item .note{font-size:13px;color:var(--muted);margin-top:3px;}
.seg{display:flex;gap:3px;align-items:center;}
.seg .blk{width:26px;height:12px;border:1px solid var(--border-2);background:var(--sunken);cursor:pointer;transition:.1s;}
[data-theme="day"] .seg .blk{border-radius:2px;}
.seg .blk.fill{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px -2px rgba(47,184,198,.6);}
.seg .blk:hover{border-color:var(--accent);}
.seg .lvl{font-family:var(--f-data);font-size:10px;color:var(--muted);margin-left:5px;}
.bigbar{flex:1;min-width:180px;height:16px;background:var(--sunken);border:1px solid var(--border-2);
  border-radius:var(--radius);overflow:hidden;display:flex;gap:2px;padding:2px;}
.bigbar .u{flex:1;background:var(--border);border-radius:1px;}
.bigbar .u.on{background:var(--accent);box-shadow:0 0 8px -2px rgba(47,184,198,.7);}
.prep-pct{font-family:var(--f-pixel);font-size:14px;color:var(--accent);}
[data-theme="day"] .prep-pct{font-family:var(--f-data);font-weight:700;font-size:18px;}

/* websites preview */
.web-list{display:flex;flex-direction:column;gap:13px;}
.web-card .card-top{align-items:center;}
.wprev-bar{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--border);flex-wrap:wrap;}
.wprev-frame{margin-top:9px;height:360px;border:1px solid var(--border-2);border-radius:var(--radius);overflow:hidden;background:#fff;}
.wprev-frame iframe{border:none;display:block;}

/* command palette */
.cmdk{position:fixed;inset:0;background:rgba(3,7,11,.72);display:flex;align-items:flex-start;justify-content:center;
  z-index:10000;padding:12vh 20px 20px;}
.cmdk.hidden{display:none;}
.cmdk-box{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--radius);
  width:100%;max-width:520px;box-shadow:var(--glow),0 24px 60px -20px rgba(0,0,0,.7);overflow:hidden;}
#cmdk-input{border:none;border-bottom:1px solid var(--border);border-radius:0;background:transparent;
  padding:15px 16px;font-size:15px;}
#cmdk-input:focus{box-shadow:none;border-color:var(--accent-line);}
.cmdk-list{max-height:46vh;overflow-y:auto;padding:6px;}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius);cursor:pointer;font-size:13.5px;}
.cmdk-item .ci-emo{width:18px;text-align:center;color:var(--accent);font-size:14px;flex:none;}
.cmdk-item .ci-lab{color:var(--ink);}
.cmdk-item .ci-hint{margin-left:auto;font-family:var(--f-data);font-size:10.5px;color:var(--faint);}
.cmdk-item.sel,.cmdk-item:hover{background:var(--accent-soft);}
.cmdk-item.sel .ci-lab{color:var(--accent);}
.cmdk-empty{padding:16px;text-align:center;color:var(--muted);font-size:12.5px;}
.cmdk-foot{border-top:1px solid var(--border);padding:8px 14px;font-family:var(--f-data);font-size:10px;color:var(--faint);}

/* toolkit */
.tk-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start;}
.tk-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tk-grid2 label.field{margin-bottom:0;}
.tk-row{margin-bottom:11px;}
.tk-out{font-family:var(--f-data);font-size:14.5px;color:var(--ink);background:var(--sunken);
  border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-top:10px;
  word-break:break-word;line-height:1.7;}
.tk-out b{font-weight:700;}
.tk-clockbig{font-family:var(--f-data);font-weight:700;font-size:40px;text-align:center;color:var(--ink);letter-spacing:.05em;padding:6px 0;}
[data-theme="pixel"] .tk-clockbig{font-family:var(--f-pixel);font-size:26px;color:var(--accent);text-shadow:0 0 16px rgba(47,184,198,.5);}

/* thoughts */
.thoughts{margin-top:26px;}
.thought{padding:10px 12px;border-left:2px solid var(--accent-line);background:var(--surface);
  border-radius:0 var(--radius) var(--radius) 0;margin-bottom:8px;font-size:14px;}
.thought .at{font-family:var(--f-data);font-size:10px;color:var(--faint);display:block;margin-bottom:3px;letter-spacing:.03em;}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;background:rgba(3,7,11,.72);display:flex;align-items:center;justify-content:center;
  z-index:9999;padding:20px;}
.modal.hidden{display:none;}
.modal-box{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--radius);
  padding:22px 24px;width:100%;max-width:440px;box-shadow:var(--glow),0 24px 60px -20px rgba(0,0,0,.7);
  max-height:88vh;overflow:auto;}
.modal-box h3{font-family:var(--f-display);font-size:12px;margin:0 0 18px;color:var(--ink);}
[data-theme="day"] .modal-box h3{font-family:var(--f-ui);font-size:17px;font-weight:600;}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px;}

/* scrollbars */
.main::-webkit-scrollbar,.qn-recent::-webkit-scrollbar{width:9px;}
.main::-webkit-scrollbar-thumb,.qn-recent::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:var(--radius);}
.main::-webkit-scrollbar-track{background:transparent;}

/* mobile: sidebar -> topbar */
@media(max-width:720px){
  body{flex-direction:column;}
  .sidebar{width:100%;flex:none;height:auto;position:sticky;top:0;flex-direction:column;
    padding:10px 14px;border-right:none;border-bottom:2px solid var(--border);gap:8px;overflow:visible;}
  .side-blank{display:none;}
  .side-dock{flex:none;border-top:none;padding-top:0;}
  .side-dock-head{margin-bottom:8px;}
  .brand{margin:0;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:5px;width:100%;overflow:visible;}
  .nav-item{width:auto;padding:8px 10px;}
  .nav-item .lab{display:none;}
  .theme-toggle{width:130px;}
  .main{height:auto;padding:18px 16px 60px;}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<div class="crt"></div>

<aside class="sidebar">
  <input type="file" id="avatarInput" accept="image/*" style="display:none">
  <div class="side-blank">
    <button class="pet" id="avatar" title="点一下换成你自己的头像"></button>
    <input type="range" class="pet-op" id="petOpacity" min="15" max="100" value="100"
      title="桌宠透明度：调高=一直陪着你，调低=给桌面图标让位">
  </div>
  <div class="side-dock">
    <div class="side-dock-head">
      <div class="side-id">
        <div class="brand">WORKBENCH<span class="cur">_</span></div>
        <div class="dock-clock" id="side-clock">--:--:--</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item" data-view="workbench"><span class="emo">◉</span><span class="lab">主页</span></button>
      <button class="nav-item" data-view="websites"><span class="emo">◈</span><span class="lab">我的网站</span></button>
      <button class="nav-item" data-view="templates"><span class="emo">▤</span><span class="lab">模板库</span></button>
      <button class="nav-item" data-view="applications"><span class="emo">⊞</span><span class="lab">申请进度</span></button>
      <button class="nav-item" data-view="prep"><span class="emo">◆</span><span class="lab">投递准备</span></button>
      <button class="nav-item" data-view="todos"><span class="emo">✓</span><span class="lab">待办 & 随想</span></button>
      <button class="nav-item" data-view="backlog"><span class="emo">❏</span><span class="lab">想做 & 在读</span></button>
      <button class="nav-item" data-view="toolkit"><span class="emo">◇</span><span class="lab">工具箱</span></button>
    </nav>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme-set="pixel" class="on">◐ 夜视</button>
      <button data-theme-set="day">◑ 护眼</button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="titlewrap" style="display:flex;flex-direction:column;gap:8px;">
      <div class="eyebrow" id="page-eyebrow">00 / HOME</div>
      <h1 id="page-title">主页</h1>
      <div class="sub" id="page-sub"></div>
    </div>
    <div class="tools">
      <button class="btn sm" data-action="cmdk" title="命令面板 ⌘K">⌘ 快捷</button>
      <button class="btn sm" data-action="backup">⛊ 备份</button>
      <button class="btn sm" data-action="export">⬇ 导出</button>
      <button class="btn sm" data-action="import">⬆ 导入</button>
      <button class="btn sm ghost" data-action="clear">清空</button>
    </div>
  </div>

  <div id="export-nudge"></div>

  <section class="view" id="view-workbench"></section>
  <section class="view" id="view-websites"></section>
  <section class="view" id="view-templates"></section>
  <section class="view" id="view-applications"></section>
  <section class="view" id="view-prep"></section>
  <section class="view" id="view-todos"></section>
  <section class="view" id="view-backlog"></section>

<script>
"use strict";
/* ===== storage (unchanged schema: keeps existing local data) ===== */
const KEY='rh_state_v1', FILE_LS='rh_files_ls', THEME_KEY='wb_theme_v1';
const SNAP_KEY='wb_snapshots_v1', META_KEY='wb_meta_v1';
const SNAP_MAX=12, SNAP_GAP=5*60*1000; /* keep 12 snapshots, at most one per 5 min */
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=> (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=> new Date().toISOString().slice(0,10);
const fmtDate=ts=>{ const d=new Date(ts); return (d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0'); };
const now=()=> Date.now();
const WEEK=7*86400000;

function seed(){
  return {
    quicklinks:[
      {id:uid(),name:'Vercel 部署',url:'https://your-app.vercel.app',note:'点进去看线上效果'},
      {id:uid(),name:'Vercel 后台',url:'https://vercel.com/dashboard',note:'部署 / 改环境变量'},
      {id:uid(),name:'GitHub',url:'https://github.com/chenwendy666888-coder',note:'直接进入项目 coding'}
    ],
    websites:[],
    templateCats:[{id:uid(),name:'投递简历中',items:[]},{id:uid(),name:'其他',items:[]}],
    applications:[],
    materials:[],
    prep:[
      {id:uid(),name:'自我介绍 (30/60s)',level:0,note:''},
      {id:uid(),name:'行为面试 STAR 练习',level:0,note:''},
      {id:uid(),name:'技术题 / 案例分析',level:0,note:''},
      {id:uid(),name:'模拟面试 (Mock)',level:0,note:''},
      {id:uid(),name:'行业 / 公司研究',level:0,note:''}
    ],
    todos:[],
    thoughts:[],
    backlog:[
      {id:uid(),text:'读招股书，多了解一下股市',kind:'在读',link:'',done:false,at:now()},
      {id:uid(),text:'趁 Claude API 到期前，试通「用 AI Agent 改这个工作台」的流程',kind:'想做',link:'',done:false,at:now()}
    ]
  };
}
let store=null;
try{ store=JSON.parse(localStorage.getItem(KEY)); }catch(e){ store=null; }
if(!store||typeof store!=='object') store=seed();
(function migrate(){
  const base=seed();
  for(const k in base){ if(!(k in store)) store[k]=base[k]; }
  ['quicklinks','websites','templateCats','applications','materials','prep','todos','thoughts','backlog']
    .forEach(k=>{ if(!Array.isArray(store[k])) store[k]=base[k]; });
  store.todos.forEach(t=>{ if(t.createdAt==null) t.createdAt=t.doneAt||now(); if(t.scope==null) t.scope='week'; });
  store.quicklinks.forEach(q=>{ if(!Array.isArray(q.children)) q.children=[]; if(q.open==null) q.open=false; });
})();
function save(){ localStorage.setItem(KEY, JSON.stringify(store)); snapshot(); }

/* ===== local auto-backup (separate keys — surviving file updates) ===== */
function loadMeta(){ try{ return JSON.parse(localStorage.getItem(META_KEY))||{}; }catch(e){ return {}; } }
function saveMeta(m){ try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){} }
function loadSnaps(){ try{ return JSON.parse(localStorage.getItem(SNAP_KEY))||[]; }catch(e){ return []; } }
function snapshot(){
  try{
    const snaps=loadSnaps();
    if(snaps.length && (now()-snaps[0].at)<SNAP_GAP) return; /* throttle */
    snaps.unshift({at:now(), data:store});
    while(snaps.length>SNAP_MAX) snaps.pop();
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps));
  }catch(e){ /* quota: silently skip, main save already succeeded */ }
}
function restoreSnapshot(i){
  const snaps=loadSnaps(); const s=snaps[i]; if(!s) return;
  if(!confirm('用 '+new Date(s.at).toLocaleString('zh-CN')+' 的快照覆盖当前数据？\n（当前状态会先存成一个新快照，可再回滚）')) return;
  snapshot(); /* preserve current before overwriting */
  store=JSON.parse(JSON.stringify(s.data)); save(); closeModal(); refresh();
}
function daysSinceExport(){
  const m=loadMeta(); if(!m.lastExport) return null;
  return Math.floor((now()-m.lastExport)/86400000);
}
function renderExportNudge(){
  const el=document.getElementById('export-nudge'); if(!el) return;
  const d=daysSinceExport();
  if(d===null || d>=7){
    const msg = d===null ? '还没导出过备份。' : ('已经 '+d+' 天没导出备份了。');
    el.innerHTML='<div style="border:1px solid var(--amber);background:var(--surface-2);border-radius:var(--radius);'+
      'padding:9px 13px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--amber)">'+
      '<span>⚠ '+msg+' 建议存一份 JSON 到本地/云盘，保险。</span>'+
      '<button class="btn sm primary" data-action="export" style="margin-left:auto">立即导出</button>'+
      '<button class="btn sm ghost" data-action="dismiss-nudge">知道了</button></div>';
  } else { el.innerHTML=''; }
}

/* ===== theme ===== */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelector('meta[name=theme-color]').setAttribute('content', t==='pixel'?'#0E141B':'#F1EEE2');
  document.querySelectorAll('#themeToggle button').forEach(b=>b.classList.toggle('on',b.dataset.themeSet===t));
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
}
applyTheme((()=>{ try{ return localStorage.getItem(THEME_KEY)||'pixel'; }catch(e){ return 'pixel'; } })());
document.getElementById('themeToggle').addEventListener('click',e=>{
  const b=e.target.closest('[data-theme-set]'); if(b) applyTheme(b.dataset.themeSet);
});

function renderAvatar(){
  const el=document.getElementById('avatar'); if(!el) return;
  let img=null; try{ img=localStorage.getItem(AVA_KEY); }catch(e){}
  el.innerHTML = img ? '<img src="'+img+'" alt="头像">' : DEFAULT_AVATAR;
}
document.getElementById('avatar').addEventListener('click',()=>document.getElementById('avatarInput').click());
document.getElementById('avatarInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ localStorage.setItem(AVA_KEY,r.result); renderAvatar(); }catch(err){ alert('图片太大，换张小一点的（建议 < 1MB / 像素图最好）。'); } };
  r.readAsDataURL(f); e.target.value='';
});
renderAvatar();

/* pet opacity (desktop-pet dimmer) */
const OPA_KEY='wb_avatar_opacity';
function applyPetOpacity(v){ const el=document.getElementById('avatar'); if(el) el.style.opacity=(v/100); }
(function initPetOpacity(){
  let v=100; try{ const s=localStorage.getItem(OPA_KEY); if(s!=null) v=+s; }catch(e){}
  const sl=document.getElementById('petOpacity'); if(sl) sl.value=v; applyPetOpacity(v);
  if(sl) sl.addEventListener('input',()=>{ applyPetOpacity(sl.value); try{ localStorage.setItem(OPA_KEY,sl.value); }catch(e){} });
})();

/* ===== files: IndexedDB with localStorage fallback (works on file://) ===== */
let _idb=null;
function idbOpen(){ return new Promise((res,rej)=>{ if(_idb) return res(_idb);
  const r=indexedDB.open('rh_files',1);
  r.onupgradeneeded=e=> e.target.result.createObjectStore('files',{keyPath:'id'});
  r.onsuccess=e=>{ _idb=e.target.result; res(_idb); };
  r.onerror=()=> rej(r.error);
}); }
function lsFiles(){ try{ return JSON.parse(localStorage.getItem(FILE_LS)||'{}'); }catch(e){ return {}; } }
function lsSet(o){ localStorage.setItem(FILE_LS, JSON.stringify(o)); }
function toBase64(buf){ const b=new Uint8Array(buf); let s=''; const c=0x8000;
  for(let i=0;i<b.length;i+=c) s+=String.fromCharCode.apply(null,b.subarray(i,i+c)); return btoa(s); }
async function filePut(id,file){
  try{ const db=await idbOpen();
    await new Promise((res,rej)=>{ const t=db.transaction('files','readwrite');
      t.objectStore('files').put({id,blob:file,name:file.name,type:file.type});
      t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); return;
  }catch(e){}
  const buf=await file.arrayBuffer();
  const all=lsFiles(); all[id]={name:file.name,type:file.type,data:toBase64(buf)}; lsSet(all);
}
async function fileGet(id){
  try{ const db=await idbOpen();
    const rec=await new Promise((res,rej)=>{ const t=db.transaction('files','readonly');
      const r=t.objectStore('files').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    if(rec&&rec.blob) return rec.blob;
  }catch(e){}
  const all=lsFiles(); const rec=all[id]; if(!rec) return null;
  const bin=atob(rec.data); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:rec.type});
}
async function fileDel(id){
  try{ const db=await idbOpen();
    await new Promise(res=>{ const t=db.transaction('files','readwrite');
      t.objectStore('files').delete(id); t.oncomplete=()=>res(); }); }catch(e){}
  const all=lsFiles(); if(all[id]){ delete all[id]; lsSet(all); }
}
async function downloadFile(fileId,name){
  const blob=await fileGet(fileId); if(!blob){ alert('文件无法读取'); return; }
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ===== todo helpers ===== */
function badgeOf(t){
  if(!t.done) return '';
  if(t.scope==='week'){
    let onTime=(t.doneAt-(t.createdAt||t.doneAt))<=WEEK;
    if(t.ddl){ const end=new Date(t.ddl+'T23:59:59').getTime(); if(t.doneAt>end) onTime=false; }
    return onTime?'<span class="badge ok">一周内完成</span>':'<span class="badge late">超时完成</span>';
  }
  return '<span class="badge ok">已完成</span>';
}
function ddlClass(t){
  if(t.done||!t.ddl) return '';
  const end=new Date(t.ddl+'T23:59:59').getTime(); const d=end-now();
  if(d<0) return 'urgent'; if(d<=3*86400000) return 'urgent'; if(d<=WEEK) return 'soon'; return '';
}
const SCOPE_LABEL={week:'一周内',impnu:'重要不紧急',long:'长期'};
const SCOPE_CLASS={week:'week',impnu:'impnu',long:'long'};
function scopeBadge(s){ return '<span class="badge '+(SCOPE_CLASS[s]||'week')+'">'+(SCOPE_LABEL[s]||'一周内')+'</span>'; }
function todoRow(t){
  return '<div class="todo '+(t.done?'done ':'')+ddlClass(t)+'">'+
    '<input type="checkbox" class="cb" '+(t.done?'checked':'')+' data-action="toggle-todo" data-id="'+t.id+'">'+
    '<div class="body"><div class="tx">'+esc(t.text)+'</div>'+
    '<div class="meta">'+
      (t.ddl?'<span class="ddl">▸ '+esc(t.ddl)+'</span>':'')+
      scopeBadge(t.scope)+
      (t.done?badgeOf(t)+' <span class="tiny">'+fmtDate(t.doneAt)+'</span>':'')+
      '<button class="icon-btn" data-action="del-todo" data-id="'+t.id+'" title="删除">✕</button>'+
    '</div></div></div>';
}
function colHTML(title,arr,cls){
  return '<div class="col '+(cls||'')+'"><h3>'+title+' <span class="cnt">'+arr.length+'</span></h3>'+
    (arr.length? arr.map(todoRow).join('') : '<div class="muted small">暂无</div>')+'</div>';
}
function todosInner(){
  const week=store.todos.filter(t=>!t.done&&t.scope==='week').sort((a,b)=>(a.ddl||'9999').localeCompare(b.ddl||'9999'));
  const impnu=store.todos.filter(t=>!t.done&&t.scope==='impnu').sort((a,b)=>(a.ddl||'9999').localeCompare(b.ddl||'9999'));
  const lng=store.todos.filter(t=>!t.done&&t.scope==='long');
  const done=store.todos.filter(t=>t.done).sort((a,b)=>b.doneAt-a.doneAt);
  return '<form data-form="add-todo" class="todo-add">'+
    '<input name="text" placeholder="要做什么？回车添加" autocomplete="off">'+
    '<input name="ddl" type="date" title="DDL（可选）">'+
    '<select name="scope" title="范围"><option value="week">一周内</option><option value="impnu">重要不紧急</option><option value="long">长期</option></select>'+
    '<button class="btn primary" type="submit">+ 添加</button></form>'+
    '<div class="todo-cols">'+
      '<div class="todo-left">'+colHTML('一周内',week,'week')+colHTML('重要不紧急',impnu,'impnu')+'</div>'+
      '<div class="todo-right">'+colHTML('长期',lng,'long')+'</div>'+
    '</div>'+
    (done.length?'<details class="done-wrap"><summary>已完成 ('+done.length+')</summary><div style="margin-top:10px">'+done.map(todoRow).join('')+'</div></details>':'');
}

function initToolkit(){
  /* finance */
  const fmt=n=>isFinite(n)?n.toLocaleString('zh-CN',{maximumFractionDigits:2}):'—';
  const finCalc=()=>{
    const mode=document.getElementById('tk-fin-mode').value;
    const P=+document.getElementById('tk-fin-p').value, r=(+document.getElementById('tk-fin-r').value)/100, n=+document.getElementById('tk-fin-n').value;
    const l1=document.getElementById('tk-fin-l1'); let out='—';
    if(mode==='fv'){ l1.textContent='本金 P'; out='终值 = '+fmt(P*Math.pow(1+r,n)); }
    else if(mode==='pv'){ l1.textContent='终值 F'; out='现值 = '+fmt(P/Math.pow(1+r,n)); }
    else { l1.textContent='每期存入 A'; const fv=r===0?P*n:P*(Math.pow(1+r,n)-1)/r; out='年金终值 = '+fmt(fv); }
    document.getElementById('tk-fin-out').textContent=out;
  };
  ['tk-fin-mode','tk-fin-p','tk-fin-r','tk-fin-n'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.addEventListener('input',finCalc); e.addEventListener('change',finCalc);} }); finCalc();
  /* percent */
  const pctCalc=()=>{ const a=+document.getElementById('tk-pct-a').value, b=+document.getElementById('tk-pct-b').value;
    document.getElementById('tk-pct-out').innerHTML='B 是 A 的 <b style="color:var(--accent)">'+fmt(a?b/a*100:0)+'%</b> · A 的 B% = <b style="color:var(--accent)">'+fmt(a*b/100)+'</b> · A→B 变化 <b style="color:var(--accent)">'+fmt(a?(b-a)/a*100:0)+'%</b>'; };
  ['tk-pct-a','tk-pct-b'].forEach(id=>document.getElementById(id).addEventListener('input',pctCalc)); pctCalc();
  /* date */
  const da=document.getElementById('tk-date-a'), db=document.getElementById('tk-date-b'); da.value=todayStr();
  const dCalc=()=>{ if(!da.value||!db.value){ document.getElementById('tk-date-out').textContent='选两个日期'; return; }
    const diff=Math.round((new Date(db.value)-new Date(da.value))/86400000);
    document.getElementById('tk-date-out').innerHTML='相差 <b style="color:var(--accent)">'+Math.abs(diff)+'</b> 天'+(diff<0?'（止在起之前）':diff>0?'（还有 '+diff+' 天）':'（同一天）'); };
  da.addEventListener('change',dCalc); db.addEventListener('change',dCalc); dCalc();
  /* word count */
  const wcIn=document.getElementById('tk-wc-in');
  const wcCalc=()=>{ const t=wcIn.value; const words=(t.trim().match(/[A-Za-z0-9']+/g)||[]).length;
    const cn=(t.match(/[\u4e00-\u9fa5]/g)||[]).length; const sent=(t.match(/[.!?。！？]/g)||[]).length;
    document.getElementById('tk-wc-out').textContent='字符 '+t.length+' · 词 '+words+' · 中文字 '+cn+' · 句 '+(sent||(t.trim()?1:0)); };
  wcIn.addEventListener('input',wcCalc);
  /* pomodoro */
  const disp=document.getElementById('tk-pomo-disp');
  const setDisp=s=>{ disp.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
  document.getElementById('tk-pomo-start').addEventListener('click',()=>{ if(_pomoTimer) return;
    _pomoTimer=setInterval(()=>{ if(_pomoLeft<=0){ clearInterval(_pomoTimer); _pomoTimer=null; disp.style.color='var(--green)'; try{new Audio().play()}catch(e){} return; } _pomoLeft--; setDisp(_pomoLeft); },1000); });
  document.getElementById('tk-pomo-pause').addEventListener('click',()=>{ if(_pomoTimer){ clearInterval(_pomoTimer); _pomoTimer=null; } });
  document.querySelectorAll('[data-pomo]').forEach(b=>b.addEventListener('click',()=>{ if(_pomoTimer){clearInterval(_pomoTimer);_pomoTimer=null;} _pomoLeft=(+b.dataset.pomo)*60; disp.style.color=''; setDisp(_pomoLeft); }));
  setDisp(_pomoLeft);
  /* json */
  const jIn=document.getElementById('tk-json-in'), jOut=document.getElementById('tk-json-out');
  const jRun=(min)=>{ try{ const o=JSON.parse(jIn.value); jIn.value=JSON.stringify(o,null,min?0:2); jOut.style.color='var(--green)'; jOut.textContent='✓ 合法 JSON，已'+(min?'压缩':'格式化'); }catch(e){ jOut.style.color='var(--red)'; jOut.textContent='✕ '+e.message; } };
  document.getElementById('tk-json-fmt').addEventListener('click',()=>jRun(false));
  document.getElementById('tk-json-min').addEventListener('click',()=>jRun(true));
}

/* ===== clock (single global ticker; drives sidebar + home) ===== */
let _pomoTimer=null,_pomoLeft=25*60;
let _clockTimer=null;
function tickClock(){
  const d=new Date();
  const t=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
  ['clock','side-clock'].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent=t; });
  const hd=document.getElementById('hud-date'); if(hd) hd.textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const sd=document.getElementById('side-date'); if(sd) sd.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
}
function startClock(){ if(_clockTimer) clearInterval(_clockTimer); tickClock(); _clockTimer=setInterval(tickClock,1000); }

function handleChange(el){
  const a=el.dataset.action;
  if(a==='toggle-todo'){ const t=store.todos.find(x=>x.id===el.dataset.id); if(t){ t.done=el.checked; t.doneAt=t.done?now():null; save(); refresh(); } }
  else if(a==='set-app-status'){ const x=store.applications.find(p=>p.id===el.dataset.id); if(x){ x.status=el.value; save(); refresh(); } }
  else if(a==='toggle-backlog'){ const b=store.backlog.find(x=>x.id===el.dataset.id); if(b){ b.done=el.checked; save(); refresh(); } }
}
function handleSubmit(f){
  const v={}; new FormData(f).forEach((val,k)=>v[k]=val);
  if(f.dataset.form==='add-todo'){ if(!v.text.trim())return; store.todos.push({id:uid(),text:v.text.trim(),ddl:v.ddl||'',scope:v.scope||'week',done:false,createdAt:now()}); save(); refresh(); }
  else if(f.dataset.form==='add-thought'){ if(!v.text.trim())return; store.thoughts.unshift({id:uid(),text:v.text.trim(),at:now()}); save(); refresh(); }
  f.reset();
}

/* file upload */
const fileInput=document.getElementById('fileInput');
function openUpload(target){ fileInput.dataset.target=target; fileInput.click(); }
fileInput.addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  const target=fileInput.dataset.target;
  const id=uid(); await filePut(id,file);
  const rec={id,name:file.name,fileId:id,addedAt:now()};
  if(target==='global') store.materials.push(rec);
  else { const ap=store.applications.find(x=>x.id===target); if(ap) ap.materials.push(rec); }
  save(); refresh(); fileInput.value='';
});

/* export / import */
function exportData(){
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='workbench-backup-'+todayStr()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  const m=loadMeta(); m.lastExport=now(); saveMeta(m); renderExportNudge();
}
document.getElementById('importInput').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
    if(data&&typeof data==='object'){ for(const k in data) store[k]=data[k];
      const base=seed(); for(const k in base){ if(!(k in store)) store[k]=base[k]; } save(); refresh(); alert('导入成功'); }
    }catch(err){ alert('导入失败：文件格式不正确'); } };
  r.readAsText(file); e.target.value='';
});

/* listeners */
document.addEventListener('click',e=>{ const b=e.target.closest('[data-action]'); if(b){ handleClick(b); } });
document.addEventListener('change',e=>{ const el=e.target.closest('[data-action]'); if(el) handleChange(el); });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form]'); if(f){ e.preventDefault(); handleSubmit(f); } });
document.getElementById('nav').addEventListener('click',e=>{ const n=e.target.closest('.nav-item'); if(n) switchView(n.dataset.view); });
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(_clockTimer){ clearInterval(_clockTimer); _clockTimer=null; } }
  else { startClock(); }
});

/* ===== command palette + hotkeys ===== */
const VIEW_ORDER=['workbench','websites','templates','applications','prep','todos','backlog','toolkit'];
const VIEW_EMO={workbench:'◉',websites:'◈',templates:'▤',applications:'⊞',prep:'◆',todos:'✓',backlog:'❏',toolkit:'◇'};
let _cmdkItems=[],_cmdkSel=0;
function buildCommands(){
  const cmds=[];
  VIEW_ORDER.forEach((v,i)=> cmds.push({emo:VIEW_EMO[v],label:TITLES[v][1],hint:(i+1)+'',run:()=>switchView(v)}));
  store.quicklinks.forEach(q=>{
    if(q.url) cmds.push({emo:'▸',label:'打开 '+q.name,hint:/^https?:/i.test(q.url)?'网页':'App',run:()=>openLink(q.url)});
    (q.children||[]).forEach(c=> cmds.push({emo:'▸',label:'打开 '+q.name+' · '+c.name,hint:/^https?:/i.test(c.url)?'网页':'App',run:()=>openLink(c.url)}));
  });
  cmds.push({emo:'✎',label:'新建待办',hint:'',run:()=>{ switchView('todos'); setTimeout(()=>{ const el=document.querySelector('#view-todos input[name=text]'); if(el) el.focus(); },60); }});
  cmds.push({emo:'✦',label:'随手小记',hint:'',run:()=>{ switchView('todos'); setTimeout(()=>{ const el=document.querySelector('#view-todos textarea[name=text]'); if(el) el.focus(); },60); }});
  cmds.push({emo:'⛊',label:'备份 & 恢复',hint:'',run:()=>openBackup()});
  cmds.push({emo:'⬇',label:'导出备份 JSON',hint:'',run:()=>exportData()});
  cmds.push({emo:'◐',label:'切换 夜视 / 护眼',hint:'',run:()=>applyTheme(document.documentElement.getAttribute('data-theme')==='pixel'?'day':'pixel')});
  return cmds;
}
function openLink(url){ if(!url) return; if(/^https?:/i.test(url)) window.open(url,'_blank','noopener'); else location.href=url; }
function openCmdk(){
  _cmdkItems=buildCommands(); _cmdkSel=0;
  document.getElementById('cmdk').classList.remove('hidden');
  const inp=document.getElementById('cmdk-input'); inp.value=''; renderCmdk(''); inp.focus();
}
function closeCmdk(){ document.getElementById('cmdk').classList.add('hidden'); }
function renderCmdk(q){
  q=(q||'').trim().toLowerCase();
  const list=q? _cmdkItems.filter(c=>c.label.toLowerCase().includes(q)) : _cmdkItems;
  _cmdkFiltered=list; if(_cmdkSel>=list.length) _cmdkSel=0;
  const el=document.getElementById('cmdk-list');
  el.innerHTML = list.length? list.map((c,i)=>'<div class="cmdk-item'+(i===_cmdkSel?' sel':'')+'" data-ci="'+i+'">'+
    '<span class="ci-emo">'+c.emo+'</span><span class="ci-lab">'+esc(c.label)+'</span>'+
    (c.hint?'<span class="ci-hint">'+esc(c.hint)+'</span>':'')+'</div>').join('')
    : '<div class="cmdk-empty">没有匹配项</div>';
}
let _cmdkFiltered=[];
function runCmdk(i){ const c=_cmdkFiltered[i]; if(c){ closeCmdk(); c.run(); } }
document.getElementById('cmdk-input').addEventListener('input',e=>renderCmdk(e.target.value));
document.getElementById('cmdk-list').addEventListener('click',e=>{ const it=e.target.closest('[data-ci]'); if(it) runCmdk(+it.dataset.ci); });
document.getElementById('cmdk-input').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); _cmdkSel=Math.min(_cmdkSel+1,_cmdkFiltered.length-1); renderCmdk(document.getElementById('cmdk-input').value); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); _cmdkSel=Math.max(_cmdkSel-1,0); renderCmdk(document.getElementById('cmdk-input').value); }
  else if(e.key==='Enter'){ e.preventDefault(); runCmdk(_cmdkSel); }
});
document.getElementById('cmdk').addEventListener('click',e=>{ if(e.target.id==='cmdk') closeCmdk(); });
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  const cmdkOpen=!document.getElementById('cmdk').classList.contains('hidden');
  if((e.metaKey||e.ctrlKey) && (e.key==='k'||e.key==='K')){ e.preventDefault(); cmdkOpen?closeCmdk():openCmdk(); return; }
  if(cmdkOpen){ if(e.key==='Escape') closeCmdk(); return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); openCmdk(); return; }
  if(/^[1-8]$/.test(e.key)){ switchView(VIEW_ORDER[+e.key-1]); }
});

/* init */
startClock();
renderExportNudge();
switchView('workbench');
</script>
