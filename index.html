<style>
/* ============ THEME TOKENS ============ */
[data-theme="pixel"]{
  --bg:#0E141B; --surface:#151D26; --surface-2:#0F1620; --sunken:#0B1119;
  --ink:#E6EDF3; --muted:#8B98A6; --faint:#5A6672;
  --accent:#2FB8C6; --accent-soft:#12303A; --accent-line:#1E4A56;
  --amber:#F5A623; --green:#34D399; --red:#FB6A6A;
  --pink:#F58AB4; --pink-soft:#341E29; --pink-line:#6E3A50;
  --border:#223040; --border-2:#2C3E50;
  --f-display:'Press Start 2P',monospace;
  --f-pixel:'Press Start 2P',monospace;
  --f-body:'IBM Plex Mono',ui-monospace,monospace;
  --f-data:'JetBrains Mono',ui-monospace,monospace;
  --f-ui:'IBM Plex Mono',ui-monospace,monospace;
  --radius:3px; --hard:1;
  --shadow:4px 4px 0 0 rgba(0,0,0,.5);
  --shadow-sm:2px 2px 0 0 rgba(0,0,0,.5);
  --glow:0 0 0 1px var(--accent-line),0 0 22px -6px rgba(47,184,198,.55);
}
[data-theme="day"]{
  --bg:#F1EEE2; --surface:#FBFAF3; --surface-2:#F5F1E5; --sunken:#EAE5D5;
  --ink:#25302A; --muted:#697A6D; --faint:#9BA79D;
  --accent:#2F7D5E; --accent-soft:#E3EEE7; --accent-line:#BCD8C8;
  --amber:#B8720C; --green:#1E8A5B; --red:#B23A48;
  --pink:#C77490; --pink-soft:#F5E4EC; --pink-line:#E6C2D2;
  --border:#DDD8C6; --border-2:#CDC7B2;
  --f-display:'Newsreader',Georgia,serif;
  --f-pixel:'IBM Plex Mono',ui-monospace,monospace;
  --f-body:'Inter',system-ui,-apple-system,sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,monospace;
  --f-ui:'Inter',system-ui,-apple-system,sans-serif;
  --radius:12px; --hard:0;
  --shadow:0 1px 2px rgba(40,60,40,.05),0 10px 26px -12px rgba(40,60,40,.22);
  --shadow-sm:0 1px 2px rgba(40,60,40,.06);
  --glow:0 1px 2px rgba(40,60,40,.05),0 12px 30px -14px rgba(47,125,94,.35);
}

/* ============ BASE ============ */
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;display:flex;font-family:var(--f-body);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:13.5px;line-height:1.6;letter-spacing:.01em;}
::selection{background:var(--accent);color:var(--bg);}
.crt{position:fixed;inset:0;pointer-events:none;z-index:9998;}
[data-theme="pixel"] .crt{background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.55;}
[data-theme="pixel"] .crt::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 120% at 50% -10%,transparent 62%,rgba(0,0,0,.4));}
[data-theme="day"] .crt{display:none;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* eyebrow — the pixel section-number signature */
.eyebrow{font-family:var(--f-pixel);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);line-height:1.5;}
[data-theme="day"] .eyebrow{font-size:10px;letter-spacing:.16em;font-weight:600;}

/* ============ SIDEBAR ============ */
.sidebar{width:214px;flex:0 0 214px;height:100vh;position:sticky;top:0;
  background:var(--surface-2);border-right:2px solid var(--border);
  display:flex;flex-direction:column;padding:16px 14px;z-index:5;overflow:hidden;}
.side-blank{flex:1 1 44%;min-height:60px;overflow-y:auto;display:flex;flex-direction:column;}
.feed-label{font-family:var(--f-pixel);font-size:8px;letter-spacing:.1em;color:var(--amber);margin-bottom:9px;flex:none;}
[data-theme="day"] .feed-label{font-family:var(--f-data);font-size:10px;font-weight:600;}
.feed-list{display:flex;flex-direction:column;gap:5px;flex:1;}
.feed-item{display:flex;align-items:center;gap:4px;}
.feed-open{flex:1;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);font-size:12px;padding:5px 7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.1s;font-family:var(--f-ui);}
.feed-open:hover{border-color:var(--amber);color:var(--amber);}
.feed-dot{color:var(--pink);font-size:8px;vertical-align:middle;}
.feed-go{color:var(--amber);text-decoration:none;font-family:var(--f-data);font-size:12px;padding:0 3px;flex:none;}
.feed-go:hover{color:var(--pink);}
.feed-item .x{color:var(--faint);cursor:pointer;font-size:10px;font-family:var(--f-data);flex:none;}
.feed-item .x:hover{color:var(--red);}
.feed-add{border:1px dashed var(--border-2);background:transparent;color:var(--muted);cursor:pointer;
  font-family:var(--f-data);font-size:11px;padding:6px;border-radius:var(--radius);margin-top:6px;flex:none;}
.feed-add:hover{border-color:var(--amber);color:var(--amber);}
.feed-sum{margin:6px 0 9px;min-height:2px;}
.feed-sum-bd{font-size:12px;line-height:1.7;color:var(--ink-2);white-space:normal;
  background:var(--sunken);border-left:2px solid var(--amber);border-radius:var(--radius);padding:7px 9px;}
.pet-float{position:fixed;left:20px;top:78px;z-index:9997;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;}
.pet{width:90px;height:90px;border:none;background:transparent;cursor:grab;padding:0;line-height:0;transition:opacity .2s;}
.pet:active{cursor:grabbing;}
.pet img,.pet svg{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));pointer-events:none;}
.pet-op{width:74px;accent-color:var(--pink);cursor:pointer;height:auto;padding:0;border:none;background:transparent;
  opacity:0;transition:opacity .2s;}
.pet-float:hover .pet-op{opacity:1;}
.pet-op:focus{box-shadow:none;}
.side-dock{flex:1 1 56%;min-height:0;display:flex;flex-direction:column;
  border-top:2px solid var(--border);padding-top:14px;}
.side-dock-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex:none;}
.dock-clock{font-family:var(--f-pixel);font-size:11px;color:var(--accent);letter-spacing:.03em;
  text-shadow:0 0 10px rgba(47,184,198,.4);margin-top:5px;}
[data-theme="day"] .dock-clock{font-family:var(--f-data);font-weight:700;font-size:14px;color:var(--ink);text-shadow:none;}
.side-panel{margin-top:auto;padding-top:18px;}
.side-top{display:flex;align-items:center;gap:11px;margin-bottom:20px;}
.sp-clock{font-family:var(--f-pixel);font-size:15px;color:var(--accent);letter-spacing:.04em;text-shadow:0 0 12px rgba(47,184,198,.45);}
[data-theme="day"] .sp-clock{font-family:var(--f-data);font-weight:700;font-size:20px;color:var(--ink);text-shadow:none;}
.sp-date{font-family:var(--f-data);font-size:10.5px;color:var(--muted);margin-top:5px;}
.sp-stats{display:flex;gap:8px;margin:13px 0;}
.sp-stat{flex:1;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:8px 9px;}
.sp-stat b{display:block;font-family:var(--f-data);font-weight:700;font-size:16px;color:var(--accent);line-height:1.1;}
.sp-stat span{font-size:9.5px;color:var(--muted);font-family:var(--f-data);letter-spacing:.02em;}
.sp-cap-label{font-family:var(--f-pixel);font-size:7.5px;color:var(--pink);letter-spacing:.08em;margin-bottom:6px;}
[data-theme="day"] .sp-cap-label{font-family:var(--f-data);font-size:10px;font-weight:600;}
.sp-capture textarea{min-height:44px;resize:vertical;font-size:12px;padding:7px 9px;}
.sp-capture .btn{width:100%;margin-top:7px;}
.avatar{flex:none;width:40px;height:40px;padding:3px;border:2px solid var(--pink-line);
  background:var(--pink-soft);border-radius:var(--radius);cursor:pointer;line-height:0;
  box-shadow:var(--shadow-sm);transition:.12s;overflow:hidden;}
.avatar:hover{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink-line),0 0 16px -4px var(--pink);}
.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;border-radius:1px;}
.avatar svg{image-rendering:pixelated;}
.side-id{min-width:0;}
.brand{font-family:var(--f-display);font-size:11px;line-height:1.5;color:var(--ink);margin:0;}
[data-theme="day"] .brand{font-size:19px;font-weight:600;}
.brand .cur{color:var(--accent);animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.brand-sub{font-family:var(--f-pixel);font-size:7.5px;color:var(--muted);margin:6px 4px 20px;letter-spacing:.1em;}
[data-theme="day"] .brand-sub{font-size:10px;}
.nav{display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:3px;}
.nav::-webkit-scrollbar{width:7px;}
.nav::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:var(--radius);}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;color:var(--muted);
  cursor:pointer;border:1px solid transparent;background:transparent;font-family:var(--f-ui);
  font-size:13px;text-align:left;width:100%;border-radius:var(--radius);transition:.12s;}
.nav-item:hover{color:var(--ink);border-color:var(--border);background:var(--surface);}
.nav-item.active{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);font-weight:600;}
[data-theme="pixel"] .nav-item.active{box-shadow:inset 2px 2px 0 rgba(0,0,0,.3);}
.nav-item .emo{width:18px;text-align:center;font-size:14px;flex:none;}
.nav-item .lab{font-size:12.5px;}
.side-foot{margin-top:auto;font-family:var(--f-pixel);font-size:7px;color:var(--faint);line-height:1.9;letter-spacing:.06em;}
[data-theme="day"] .side-foot{font-size:9.5px;font-family:var(--f-data);}
.theme-toggle{display:flex;gap:0;margin-top:14px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.theme-toggle button{flex:1;padding:8px 4px;background:var(--surface);border:none;color:var(--muted);
  font-family:var(--f-pixel);font-size:7.5px;letter-spacing:.06em;cursor:pointer;transition:.12s;}
[data-theme="day"] .theme-toggle button{font-family:var(--f-data);font-size:10px;font-weight:600;}
.theme-toggle button.on{background:var(--accent);color:var(--bg);}
.theme-toggle button:not(.on):hover{color:var(--ink);}

/* ============ MAIN ============ */
.main{flex:1;height:100vh;overflow:auto;padding:22px 30px 70px;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.topbar h1{font-family:var(--f-display);font-size:16.5px;line-height:1.5;margin:8px 0 0;color:var(--ink);}
[data-theme="day"] .topbar h1{font-size:26px;font-weight:600;margin:2px 0 0;}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:8px;}
.tools{display:flex;gap:7px;flex-wrap:wrap;padding-top:4px;}
section.view{display:none;}
section.view.active{display:block;animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.view-head h2{font-family:var(--f-display);font-size:15px;margin:0;color:var(--ink);}
[data-theme="day"] .view-head h2{font-size:20px;font-weight:600;}
.view-head .titlewrap{display:flex;flex-direction:column;gap:7px;}

/* ============ BUTTONS / INPUTS ============ */
.btn{font-family:var(--f-ui);font-size:12px;font-weight:600;padding:8px 13px;border-radius:var(--radius);
  border:1px solid var(--border-2);background:var(--surface);color:var(--ink);cursor:pointer;
  box-shadow:var(--shadow-sm);transition:.1s;}
.btn:hover{border-color:var(--accent-line);color:var(--accent);}
.btn:active{transform:translate(2px,2px);box-shadow:none;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.btn.primary:hover{filter:brightness(1.08);color:var(--bg);}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);}
.btn.ghost:hover{color:var(--ink);background:var(--surface);}
.btn.sm{padding:5px 9px;font-size:11px;}
.icon-btn{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;
  padding:3px 6px;border-radius:var(--radius);line-height:1;font-family:var(--f-data);}
.icon-btn:hover{background:var(--accent-soft);color:var(--red);}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-family:var(--f-data);
  font-size:11px;padding:0;letter-spacing:.02em;}
.linkbtn:hover{text-decoration:underline;}
input,select,textarea{font-family:var(--f-body);font-size:13.5px;color:var(--ink);background:var(--sunken);
  border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;width:100%;outline:none;transition:.12s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
input::placeholder,textarea::placeholder{color:var(--faint);}
label.field{display:block;margin-bottom:13px;}
label.field>span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-family:var(--f-pixel);
  letter-spacing:.04em;}
[data-theme="day"] label.field>span{font-family:var(--f-ui);font-size:12px;font-weight:500;}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--shadow);}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-title{font-size:15.5px;font-weight:600;color:var(--accent);text-decoration:none;word-break:break-word;font-family:var(--f-ui);}
.card-title:hover{text-decoration:underline;}
.muted{color:var(--muted);}.small{font-size:13px;}
.tiny{font-size:10px;color:var(--faint);font-family:var(--f-data);letter-spacing:.03em;}
.empty{padding:34px 24px;border:1px dashed var(--border-2);border-radius:var(--radius);text-align:center;
  color:var(--muted);background:var(--surface-2);font-size:13.5px;}

/* ============ BADGES ============ */
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:var(--radius);
  font-family:var(--f-data);letter-spacing:.04em;border:1px solid transparent;text-transform:uppercase;}
.badge.week{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
.badge.long{background:transparent;color:var(--amber);border-color:var(--amber);}
.badge.impnu{background:var(--pink-soft);color:var(--pink);border-color:var(--pink-line);}
.badge.day{background:transparent;color:var(--amber);border-color:var(--amber);}
.badge.ok{background:transparent;color:var(--green);border-color:var(--green);}
.badge.late{background:transparent;color:var(--red);border-color:var(--red);}
.badge.mut{background:var(--sunken);color:var(--muted);border-color:var(--border);}

/* ============ HUD (home top) ============ */
.hud{border:1px solid var(--accent-line);border-radius:var(--radius);background:var(--surface-2);
  padding:14px 16px;margin-bottom:16px;box-shadow:var(--glow);}
.hud-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.hud-clock{font-family:var(--f-data);font-weight:700;font-size:22px;color:var(--ink);letter-spacing:.04em;}
[data-theme="pixel"] .hud-clock{font-family:var(--f-pixel);font-size:13px;color:var(--accent);text-shadow:0 0 14px rgba(47,184,198,.5);}
.hud-date{font-family:var(--f-data);font-size:13px;color:var(--muted);}
.hud-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;}
.hud-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
@media(max-width:820px){.hud-cols{grid-template-columns:1fr;}}
.hud-col .eyebrow{margin-bottom:9px;}
.hud-col .quicklinks{margin-top:0;padding-top:0;border-top:none;}
.ailinks{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;}
.ai-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--pink-line);
  border-radius:var(--radius);background:var(--pink-soft);color:var(--ink);text-decoration:none;font-size:12px;
  box-shadow:var(--shadow-sm);transition:.1s;}
.ai-chip:hover{border-color:var(--pink);color:var(--pink);transform:translateY(-1px);}
.ai-chip .arw{color:var(--pink);font-family:var(--f-data);}
.ai-chip .x{color:var(--faint);cursor:pointer;font-family:var(--f-data);font-size:11px;}
.ai-chip .x:hover{color:var(--red);}
.hud-stat{font-family:var(--f-data);font-size:12.5px;color:var(--muted);white-space:nowrap;}
.hud-stat b{color:var(--accent);font-weight:700;font-size:14.5px;}
.quicklinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);align-items:flex-start;}
.qgroup{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  box-shadow:var(--shadow-sm);min-width:150px;overflow:hidden;transition:.1s;}
.qgroup.open{border-color:var(--accent-line);}
.qhead{display:flex;align-items:center;gap:6px;padding:7px 9px;}
.qname{color:var(--ink);text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap;}
a.qname:hover{color:var(--accent);text-decoration:underline;}
.qcaret{border:none;background:transparent;color:var(--accent);cursor:pointer;font-family:var(--f-data);
  font-size:11px;padding:1px 4px;display:flex;align-items:center;gap:3px;border-radius:var(--radius);}
.qcaret i{font-style:normal;font-size:9px;background:var(--accent-soft);color:var(--accent);
  padding:0 4px;border-radius:6px;border:1px solid var(--accent-line);}
.qcaret:hover{background:var(--accent-soft);}
.qgroup .x{color:var(--faint);cursor:pointer;font-size:11px;font-family:var(--f-data);padding:0 2px;}
.qgroup .x:hover{color:var(--red);}
.qkids{border-top:1px dashed var(--border);padding:7px 9px;display:flex;flex-direction:column;gap:5px;background:var(--sunken);}
.qkid{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.qkid a{color:var(--pink);text-decoration:none;font-size:11.5px;word-break:break-all;}
.qkid a:hover{text-decoration:underline;}
.qkid-add{align-self:flex-start;border:1px dashed var(--pink-line);background:transparent;color:var(--pink);
  font-family:var(--f-data);font-size:10px;padding:3px 8px;border-radius:var(--radius);cursor:pointer;margin-top:2px;}
.qkid-add:hover{background:var(--pink-soft);}
.qadd{border:1px dashed var(--border-2);background:transparent;color:var(--muted);cursor:pointer;
  font-family:var(--f-ui);font-size:12px;padding:8px 11px;border-radius:var(--radius);align-self:flex-start;}
.qadd:hover{border-color:var(--accent-line);color:var(--accent);}

/* ============ HOME GRID ============ */
.home{display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(300px,.95fr);gap:18px;align-items:start;}
@media(max-width:980px){.home{grid-template-columns:1fr;}}
.panel-label{display:flex;align-items:center;gap:9px;margin:0 0 12px;}
.panel-label .bar{flex:1;height:1px;background:var(--border);}
.home-right{display:flex;flex-direction:column;gap:14px;}
.home-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.home-cards{grid-template-columns:1fr;}}
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.hcard-head{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;margin-bottom:9px;gap:8px;}
.hcard-head .nm{font-family:var(--f-ui);font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;}
.hcard-body{font-size:13.5px;flex:1;min-height:48px;}
.mini{display:flex;flex-direction:column;gap:6px;}
.mini a{color:var(--accent);text-decoration:none;font-size:13px;word-break:break-all;}
.mini a:hover{text-decoration:underline;}
.mini .row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;}

/* quick note */
.quicknote{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow);}
.quicknote textarea{min-height:52px;resize:vertical;line-height:1.55;}
.quicknote .qn-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.qn-recent{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto;}
.qn-item{font-size:13px;padding:7px 9px;background:var(--sunken);border-radius:var(--radius);border-left:2px solid var(--accent-line);}
.qn-item .at{font-family:var(--f-data);font-size:9.5px;color:var(--faint);display:block;margin-bottom:2px;letter-spacing:.03em;}

/* ============ TODO ============ */
.todo-add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.todo-add input[name=text]{flex:1;min-width:150px;}
.todo-add input[name=ddl]{width:auto;}
.todo-add select{width:auto;}
.todo-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.todo-left{display:flex;flex-direction:column;gap:18px;}
@media(max-width:760px){.todo-cols{grid-template-columns:1fr;}}
.col h3{font-size:13px;font-family:var(--f-pixel);letter-spacing:.06em;margin:0 0 11px;display:flex;align-items:center;gap:8px;color:var(--ink);}
[data-theme="day"] .col h3{font-family:var(--f-ui);font-size:14px;font-weight:600;}
.col h3 .cnt{font-family:var(--f-data);font-size:11px;color:var(--accent);font-weight:700;}
.col.day h3 .cnt{color:var(--amber);}
.col.impnu h3 .cnt{color:var(--pink);}
.col.long h3 .cnt{color:var(--amber);}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface);margin-bottom:8px;transition:.1s;}
.todo:hover{border-color:var(--border-2);}
.todo .cb{flex:0 0 auto;width:16px;height:16px;margin-top:2px;cursor:pointer;accent-color:var(--accent);}
.todo .body{flex:1;min-width:0;}
.todo .tx{word-break:break-word;font-size:14px;}
.todo.done{opacity:.6;}
.todo.done .tx{text-decoration:line-through;color:var(--muted);}
.todo .meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap;}
.todo .ddl{font-family:var(--f-data);font-size:11px;color:var(--muted);}
.todo.urgent{border-left:3px solid var(--red);}
.todo.urgent .ddl{color:var(--red);font-weight:700;}
.todo.soon{border-left:3px solid var(--amber);}
.todo.soon .ddl{color:var(--amber);}
.done-wrap{margin-top:14px;}
.done-wrap summary{cursor:pointer;color:var(--muted);font-size:13px;font-family:var(--f-data);}

/* ============ TEMPLATES ============ */
.cat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px;}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.cat-head h3{margin:0;font-size:15.5px;font-weight:600;font-family:var(--f-ui);color:var(--ink);}
.cat-items{display:flex;flex-direction:column;gap:7px;}
.tpl{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 10px;
  background:var(--sunken);border-radius:var(--radius);}
.tpl a{color:var(--accent);text-decoration:none;font-size:14px;word-break:break-word;}
.tpl a:hover{text-decoration:underline;}
.tpl .meta{font-size:12px;color:var(--muted);margin-top:3px;}

/* ============ APPLICATIONS ============ */
.app-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);margin-bottom:13px;}
.app-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.app-head .nm{font-size:15.5px;font-weight:600;font-family:var(--f-ui);color:var(--ink);}
.app-head .ctl{display:flex;align-items:center;gap:8px;}
.app-head select{width:auto;font-size:11.5px;padding:6px 9px;}
.mat-zone{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px;}
.mat-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;
  background:var(--sunken);border-radius:var(--radius);margin-bottom:6px;font-size:13px;}
.mat-item .fn{color:var(--ink);word-break:break-all;}
.mat-actions{display:flex;gap:4px;flex:none;}

/* ============ PREP (segmented pixel bars) ============ */
.prep-overall{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.prep-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:10px;}
.prep-item .pi-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
.prep-item .nm{font-size:15px;font-weight:600;font-family:var(--f-ui);color:var(--ink);}
.prep-item .note{font-size:13px;color:var(--muted);margin-top:3px;}
.seg{display:flex;gap:3px;align-items:center;}
.seg .blk{width:26px;height:12px;border:1px solid var(--border-2);background:var(--sunken);cursor:pointer;transition:.1s;}
[data-theme="day"] .seg .blk{border-radius:2px;}
.seg .blk.fill{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px -2px rgba(47,184,198,.6);}
.seg .blk:hover{border-color:var(--accent);}
.seg .lvl{font-family:var(--f-data);font-size:10px;color:var(--muted);margin-left:5px;}
.bigbar{flex:1;min-width:180px;height:16px;background:var(--sunken);border:1px solid var(--border-2);
  border-radius:var(--radius);overflow:hidden;display:flex;gap:2px;padding:2px;}
.bigbar .u{flex:1;background:var(--border);border-radius:1px;}
.bigbar .u.on{background:var(--accent);box-shadow:0 0 8px -2px rgba(47,184,198,.7);}
.prep-pct{font-family:var(--f-pixel);font-size:14px;color:var(--accent);}
[data-theme="day"] .prep-pct{font-family:var(--f-data);font-weight:700;font-size:18px;}

/* widget home */
.home-edit-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.widget-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));grid-auto-rows:8px;column-gap:16px;row-gap:16px;grid-auto-flow:row dense;}
.widget{min-width:0;align-self:start;grid-row-end:span 30;}
.widget.full{grid-column:1/-1;}
.widget.wide{grid-column:span 2;}
.widget-grid.editing .widget{border:1px dashed var(--accent-line);border-radius:var(--radius);padding:6px;background:var(--surface-2);cursor:grab;transition:.1s;}
.widget-grid.editing .widget:hover{border-color:var(--accent);}
.widget.dragging{opacity:.4;}
.widget-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 8px;}
.whandle{font-family:var(--f-data);font-size:11px;color:var(--accent);letter-spacing:.03em;}
.widget-grid.editing .widget-body{pointer-events:none;}

/* templates 2-level */
.tpl-group{margin-bottom:22px;}
.tpl-group-head{font-family:var(--f-pixel);font-size:10px;letter-spacing:.08em;color:var(--amber);
  margin-bottom:11px;padding-bottom:7px;border-bottom:2px solid var(--border);}
[data-theme="day"] .tpl-group-head{font-family:var(--f-ui);font-size:15px;font-weight:700;}
.tpl-detail{margin-top:8px;padding:9px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.tpl-content{font-family:var(--f-data);font-size:11.5px;color:var(--ink);background:var(--sunken);border:1px solid var(--border);
  border-radius:var(--radius);padding:9px;margin:0 0 8px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;}

/* websites preview */
.web-list{margin:0;}
.web-card .card-top{align-items:center;}
.viewtog{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.viewtog button{border:none;background:var(--surface);color:var(--muted);font-family:var(--f-ui);font-size:12px;
  padding:7px 12px;cursor:pointer;transition:.1s;border-right:1px solid var(--border);}
.viewtog button:last-child{border-right:none;}
.viewtog button.on{background:var(--accent);color:var(--bg);font-weight:600;}
.viewtog button:not(.on):hover{color:var(--ink);}
.web-details{margin:10px 0 2px;padding:11px;background:var(--sunken);border-radius:var(--radius);border:1px solid var(--border);}
.wd-row{display:flex;gap:10px;margin-bottom:9px;font-size:12.5px;}
.wd-row:last-child{margin-bottom:0;}
.wd-k{flex:none;width:74px;font-family:var(--f-pixel);font-size:8px;letter-spacing:.05em;color:var(--accent);padding-top:3px;}
[data-theme="day"] .wd-k{font-family:var(--f-ui);font-size:11px;font-weight:600;}
.wd-v{flex:1;min-width:0;color:var(--ink);line-height:1.55;word-break:break-word;}
.kanban{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-items:start;}
.kanban-col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:11px;}
.kanban-head{font-family:var(--f-pixel);font-size:8.5px;letter-spacing:.06em;color:var(--ink);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
[data-theme="day"] .kanban-head{font-family:var(--f-ui);font-size:13px;font-weight:600;}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 10px;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.kanban-card a{color:var(--accent);text-decoration:none;font-size:12.5px;word-break:break-word;}
.kanban-card a:hover{text-decoration:underline;}
.wprev-bar{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--border);flex-wrap:wrap;}
.wprev-frame{margin-top:9px;height:360px;border:1px solid var(--border-2);border-radius:var(--radius);overflow:hidden;background:#fff;}
.wprev-frame iframe{border:none;display:block;}
/* ===== card customizer / free adjust ===== */
.web-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));grid-auto-rows:8px;column-gap:13px;row-gap:13px;grid-auto-flow:row dense;}
.web-card{align-self:start;grid-row-end:span 30;}
.cs-btn{color:var(--muted);}
.cs-btn:hover{color:var(--accent);}
.web-ai-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px;}
.ai-chip.sm{font-size:11px;padding:3px 8px;}
.qkid-add{cursor:pointer;}
.cs-swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.cs-sw{width:30px;height:30px;border-radius:8px;border:2px solid var(--border-2);cursor:pointer;position:relative;}
.cs-sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-line);}
.cs-sw.none{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);background:var(--surface-2);}
.cs-seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.cs-seg button{padding:5px 11px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--ink);border-radius:8px;cursor:pointer;font-size:12px;}
.cs-seg button.on{border-color:var(--accent);color:var(--accent);}
.kanban-prev{margin-top:8px;border:1px solid var(--border-2);border-radius:8px;overflow:hidden;background:#fff;height:130px;}
.kanban-prev iframe{border:none;display:block;width:200%;height:260px;transform:scale(.5);transform-origin:top left;}
.kb-toggle{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 0;margin-top:4px;}
.kb-toggle:hover{color:var(--accent);}
.modal-box h3{cursor:move;user-select:none;}
.modal-box h3::before{content:"⠿ ";opacity:.5;font-size:.85em;}
.prep-link-btns{display:flex;gap:4px;align-items:center;}
.web-drag{cursor:grab;color:var(--muted);font-size:14px;margin-right:2px;user-select:none;flex:none;}
.web-drag:hover{color:var(--accent);}
.web-card.wdragging{opacity:.4;outline:2px dashed var(--accent);}
.web-preview-box{margin-top:9px;border:1px solid var(--border-2);border-radius:var(--radius);overflow:hidden;}
.todo{touch-action:pan-y;}
.todo.swiping{transition:none;}
.todo.swipe-anim{transition:transform .18s ease, opacity .18s ease;}
.qkid.dragging-mini,.ai-chip.dragging-mini{opacity:.4;}
/* ===== idea card ===== */
.idea-card{margin-top:9px;border:1px solid var(--border-2);border-radius:var(--radius);background:var(--surface-2);padding:11px 12px;}
.idea-field{margin-bottom:9px;}
.idea-field .k{font-size:11px;color:var(--muted);font-family:var(--f-data);letter-spacing:.04em;margin-bottom:3px;}
.idea-field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--ink);padding:6px 8px;font:inherit;resize:vertical;min-height:34px;}
.idea-steps{display:flex;flex-direction:column;gap:5px;margin:4px 0;}
.idea-step{border-left:2px solid var(--border-2);padding-left:8px;}
.idea-step .st-main{display:flex;align-items:center;gap:6px;}
.idea-step .st-main .tx{flex:1;}
.idea-sub{display:flex;align-items:center;gap:6px;margin:3px 0 3px 16px;font-size:13px;}
.idea-done{text-decoration:line-through;color:var(--muted);}
.idea-prog{height:6px;border-radius:3px;background:var(--surface);overflow:hidden;margin:6px 0;}
.idea-prog > i{display:block;height:100%;background:var(--accent);transition:width .2s;}
.hintchip{border:1px dashed var(--border-2);background:none;color:var(--muted);border-radius:20px;padding:2px 9px;font-size:11px;cursor:pointer;}
.hintchip:hover{border-color:var(--accent);color:var(--accent);}
.idea-addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px;}
.idea-addrow input{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--ink);padding:5px 8px;font:inherit;}
.status-badge{cursor:pointer;user-select:none;}

/* command palette */
.cmdk{position:fixed;inset:0;background:rgba(3,7,11,.72);display:flex;align-items:flex-start;justify-content:center;
  z-index:10000;padding:12vh 20px 20px;}
.cmdk.hidden{display:none;}
.cmdk-box{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--radius);
  width:100%;max-width:520px;box-shadow:var(--glow),0 24px 60px -20px rgba(0,0,0,.7);overflow:hidden;}
#cmdk-input{border:none;border-bottom:1px solid var(--border);border-radius:0;background:transparent;
  padding:15px 16px;font-size:15px;}
#cmdk-input:focus{box-shadow:none;border-color:var(--accent-line);}
.cmdk-list{max-height:46vh;overflow-y:auto;padding:6px;}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius);cursor:pointer;font-size:13.5px;}
.cmdk-item .ci-emo{width:18px;text-align:center;color:var(--accent);font-size:14px;flex:none;}
.cmdk-item .ci-lab{color:var(--ink);}
.cmdk-item .ci-hint{margin-left:auto;font-family:var(--f-data);font-size:10.5px;color:var(--faint);}
.cmdk-item.sel,.cmdk-item:hover{background:var(--accent-soft);}
.cmdk-item.sel .ci-lab{color:var(--accent);}
.cmdk-empty{padding:16px;text-align:center;color:var(--muted);font-size:12.5px;}
.cmdk-foot{border-top:1px solid var(--border);padding:8px 14px;font-family:var(--f-data);font-size:10px;color:var(--faint);}

/* review & habits */
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
@media(max-width:820px){.review-grid{grid-template-columns:1fr;}}
.habit{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);}
.habit:last-of-type{border-bottom:none;}
.habit-check{flex:none;width:26px;height:26px;border:2px solid var(--border-2);border-radius:var(--radius);
  background:var(--sunken);color:var(--bg);cursor:pointer;font-family:var(--f-data);font-weight:700;font-size:13px;transition:.12s;}
.habit-check.on{background:var(--green);border-color:var(--green);}
.habit-check:hover{border-color:var(--green);}
.habit-body{flex:1;min-width:0;}
.habit-top{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.habit-name{font-size:13.5px;font-weight:600;font-family:var(--f-ui);color:var(--ink);flex:1;}
.habit-streak{font-family:var(--f-data);font-size:11px;color:var(--faint);flex:none;}
.habit-streak.hot{color:var(--amber);font-weight:700;}
.hdots{display:flex;gap:3px;}
.hdot{width:12px;height:12px;border-radius:2px;background:var(--sunken);border:1px solid var(--border);}
.hdot.on{background:var(--green);border-color:var(--green);box-shadow:0 0 6px -2px var(--green);}
.habit-chips{display:flex;flex-wrap:wrap;gap:6px;}
.hchip{border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;
  font-size:11.5px;padding:5px 9px;border-radius:var(--radius);font-family:var(--f-ui);transition:.1s;}
.hchip b{font-family:var(--f-data);color:var(--amber);}
.hchip.on{background:var(--accent-soft);border-color:var(--green);color:var(--green);}
.hchip:hover{border-color:var(--green);}

/* stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start;}

/* togolist */
.progbar{flex:1;height:9px;background:var(--sunken);border:1px solid var(--border-2);border-radius:var(--radius);overflow:hidden;min-width:80px;}
.progbar-fill{height:100%;border-radius:var(--radius);transition:width .25s;box-shadow:0 0 8px -2px currentColor;}
.togo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:11px;}
.togo-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.togo-caret{border:none;background:transparent;color:var(--accent);cursor:pointer;font-family:var(--f-data);font-size:12px;padding:0 2px;flex:none;}
.togo-st{width:auto;font-size:11px;padding:4px 7px;flex:none;}
.togo-title{font-size:14px;font-weight:600;font-family:var(--f-ui);color:var(--ink);flex:1;min-width:100px;}
.togo-actions{display:flex;gap:2px;flex:none;margin-left:auto;}
.togo-prog{display:flex;align-items:center;gap:9px;margin-top:10px;}
.togo-pct{font-family:var(--f-data);font-weight:700;font-size:12px;flex:none;}
.togo-subs{margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:5px;}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sub label{display:flex;align-items:center;gap:9px;cursor:pointer;flex:1;font-size:12.5px;}
.sub .cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex:none;}
.sub-done{text-decoration:line-through;color:var(--muted);}
.sub-add{display:flex;gap:6px;margin-top:4px;}
.sub-add input{flex:1;font-size:12px;padding:6px 9px;}
.sub-add .btn{flex:none;}

/* feed window */
.feedwin-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.feedwin-body{margin-bottom:8px;}

/* daily quote */
.daily-quote{display:flex;align-items:flex-start;gap:6px;margin:2px 0 18px;padding:2px 0;}
.dq-mark{font-family:var(--f-display);color:var(--pink);font-size:20px;line-height:1;flex:none;opacity:.7;}
[data-theme="day"] .dq-mark{font-family:Georgia,serif;font-size:26px;}
.dq-text{font-size:15px;color:var(--muted);font-style:italic;cursor:pointer;line-height:1.5;letter-spacing:.02em;transition:.12s;}
.dq-text:hover{color:var(--pink);}
.dq-edit{border:none;background:transparent;color:var(--faint);cursor:pointer;font-family:var(--f-data);font-size:12px;padding:2px 5px;flex:none;}
.dq-edit:hover{color:var(--pink);}

/* toolkit */
.tk-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start;}
.tk-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tk-grid2 label.field{margin-bottom:0;}
.tk-row{margin-bottom:11px;}
.tk-out{font-family:var(--f-data);font-size:14.5px;color:var(--ink);background:var(--sunken);
  border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-top:10px;
  word-break:break-word;line-height:1.7;}
.tk-out b{font-weight:700;}
.tk-clockbig{font-family:var(--f-data);font-weight:700;font-size:40px;text-align:center;color:var(--ink);letter-spacing:.05em;padding:6px 0;}
[data-theme="pixel"] .tk-clockbig{font-family:var(--f-pixel);font-size:26px;color:var(--accent);text-shadow:0 0 16px rgba(47,184,198,.5);}

/* thoughts */
.thoughts{margin-top:26px;}
.thought{padding:10px 12px;border-left:2px solid var(--accent-line);background:var(--surface);
  border-radius:0 var(--radius) var(--radius) 0;margin-bottom:8px;font-size:14px;}
.thought .at{font-family:var(--f-data);font-size:10px;color:var(--faint);display:block;margin-bottom:3px;letter-spacing:.03em;}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;background:rgba(3,7,11,.72);display:flex;align-items:center;justify-content:center;
  z-index:9999;padding:20px;}
.modal.hidden{display:none;}
.modal-box{background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--radius);
  padding:22px 24px;width:100%;max-width:440px;box-shadow:var(--glow),0 24px 60px -20px rgba(0,0,0,.7);
  max-height:88vh;overflow:auto;}
.modal-box h3{font-family:var(--f-display);font-size:12px;margin:0 0 18px;color:var(--ink);}
[data-theme="day"] .modal-box h3{font-family:var(--f-ui);font-size:17px;font-weight:600;}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px;}

/* scrollbars */
.main::-webkit-scrollbar,.qn-recent::-webkit-scrollbar{width:9px;}
.main::-webkit-scrollbar-thumb,.qn-recent::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:var(--radius);}
.main::-webkit-scrollbar-track{background:transparent;}

/* mobile: sidebar -> topbar */
@media(max-width:720px){
  body{flex-direction:column;}
  .sidebar{width:100%;flex:none;height:auto;position:sticky;top:0;flex-direction:column;
    padding:10px 14px;border-right:none;border-bottom:2px solid var(--border);gap:8px;overflow:visible;}
  .side-blank{display:none;}
  .side-dock{flex:none;border-top:none;padding-top:0;}
  .side-dock-head{margin-bottom:8px;}
  .brand{margin:0;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:5px;width:100%;overflow:visible;}
  .nav-item{width:auto;padding:8px 10px;}
  .nav-item .lab{display:none;}
  .theme-toggle{width:130px;}
  .main{height:auto;padding:18px 16px 60px;}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
/* ===== weather widget ===== */
.wthr-now{display:flex;gap:12px;align-items:center;margin-bottom:10px;}
.wthr-ico{font-size:40px;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));}
.wthr-temp{font-family:var(--f-pixel);font-size:22px;color:var(--accent);text-shadow:0 0 12px rgba(47,184,198,.4);}
[data-theme="day"] .wthr-temp{font-family:var(--f-data);font-weight:700;font-size:24px;text-shadow:none;}
.wthr-days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--border);padding-top:9px;}
.wthr-day{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-data);font-size:12px;}
.wthr-day b{font-size:13px;color:var(--ink);}
.wthr-dlbl{color:var(--muted);font-size:10px;}
.wthr-dico{font-size:20px;}
/* ===== feed + chat widgets ===== */
.feed-srcs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:2px;}
.feed-src{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2px 6px;font-family:var(--f-data);font-size:10.5px;color:var(--muted);}
.feed-src .x{cursor:pointer;color:var(--faint);}
.feed-src .x:hover{color:var(--red);}
.feed-list2{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;margin-top:4px;}
.feed-item2{display:flex;flex-direction:column;gap:1px;text-decoration:none;color:var(--ink);padding:5px 7px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);transition:.1s;}
.feed-item2:hover{border-color:var(--amber);}
.fi-tt{font-family:var(--f-ui);font-size:12.5px;line-height:1.35;}
.fi-meta{font-family:var(--f-data);font-size:10px;color:var(--muted);}
.chat-body{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;margin-bottom:2px;}
.chat-b{font-family:var(--f-ui);font-size:12.5px;line-height:1.45;padding:6px 8px;border-radius:var(--radius);white-space:pre-wrap;word-break:break-word;}
.chat-b.user{background:var(--accent-soft);border:1px solid var(--accent-line);align-self:flex-end;max-width:90%;}
.chat-b.ai{background:var(--surface);border:1px solid var(--border);align-self:flex-start;max-width:95%;}
.insp-list{display:flex;flex-direction:column;gap:7px;}
.insp-item{display:flex;gap:8px;align-items:center;background:var(--sunken);border:1px solid var(--border);border-radius:var(--radius);padding:7px 9px;}
.insp-tt{font-family:var(--f-ui);font-size:12.5px;line-height:1.35;flex:1;min-width:0;}
.insp-btns{display:flex;gap:5px;flex-shrink:0;}
.insp-btns .btn{white-space:nowrap;}
</style>
</head>

<div class="crt"></div>
<div class="pet-float" id="petFloat">

<div class="cmdk hidden" id="cmdk">
  <div class="cmdk-box">
    <input id="cmdk-input" placeholder="跳转 / 打开…（数字键 1–8 直达页面）" autocomplete="off">

if(!store||typeof store!=='object') store=seed();
(function migrate(){

  for(const k in base){ if(!(k in store)) store[k]=base[k]; }
  ['quicklinks','websites','templateCats','applications','materials','prep','todos','thoughts','backlog','aiLinks','sidelinks','quotes','togo','focusLog','habits','diary','feedSources','homeLayout']
    .forEach(k=>{ if(!Array.isArray(store[k])) store[k]=base[k]; });
  store.todos.forEach(t=>{ if(t.createdAt==null) t.createdAt=t.doneAt||now(); if(t.scope==null) t.scope='week'; if(t.scope==='long') t.scope='impnu'; });
  store.quicklinks.forEach(q=>{ if(!Array.isArray(q.children)) q.children=[]; if(q.open==null) q.open=false; });

    if(w.kanbanClosed==null) w.kanbanClosed=false; if(w.previewOpen==null) w.previewOpen=false; });
  store.prep.forEach(p=>{ if(p.link==null) p.link=''; });
  if(!store.cardStyle || typeof store.cardStyle!=='object' || Array.isArray(store.cardStyle)) store.cardStyle={};
  store.templateCats.forEach(c=>{ if(c.group==null) c.group='其他'; (c.items||[]).forEach(it=>{ if(it.type==null) it.type='其他'; if(it.content==null) it.content=''; if(it.open==null) it.open=false; }); });
  if(!Array.isArray(store.quotes)||!store.quotes.length) store.quotes=base.quotes;
  if(!Array.isArray(store.togo)) store.togo=base.togo;
  store.togo.forEach(p=>{ if(!Array.isArray(p.subs)) p.subs=[]; if(p.open==null) p.open=true; if(p.status==null) p.status='进行'; if(p.priority==null) p.priority='中'; });
  if(!Array.isArray(store.habits)) store.habits=base.habits;
  store.habits.forEach(hb=>{ if(!Array.isArray(hb.log)) hb.log=[]; });

  if(store.weatherDismissed==null) store.weatherDismissed=false;
  if(!store.weatherDismissed && store.homeLayout.indexOf('weather')<0) store.homeLayout.push('weather');
})();
function save(){ localStorage.setItem(KEY, JSON.stringify(store)); snapshot(); }

/* ===== local auto-backup (separate keys — surviving file updates) ===== */
function loadMeta(){ try{ return JSON.parse(localStorage.getItem(META_KEY))||{}; }catch(e){ return {}; } }
function saveMeta(m){ try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){} }
function loadSnaps(){ try{ return JSON.parse(localStorage.getItem(SNAP_KEY))||[]; }catch(e){ return []; } }
function snapshot(){
  try{
    const snaps=loadSnaps();
    if(snaps.length && (now()-snaps[0].at)<SNAP_GAP) return; /* throttle */
    snaps.unshift({at:now(), data:store});
    while(snaps.length>SNAP_MAX) snaps.pop();
    localStorage.setItem(SNAP_KEY, JSON.stringify(snaps));
  }catch(e){ /* quota: silently skip, main save already succeeded */ }
}
function restoreSnapshot(i){
  const snaps=loadSnaps(); const s=snaps[i]; if(!s) return;
  if(!confirm('用 '+new Date(s.at).toLocaleString('zh-CN')+' 的快照覆盖当前数据？\n（当前状态会先存成一个新快照，可再回滚）')) return;
  snapshot(); /* preserve current before overwriting */
  store=JSON.parse(JSON.stringify(s.data)); save(); closeModal(); refresh();
}
function daysSinceExport(){
  const m=loadMeta(); if(!m.lastExport) return null;
  return Math.floor((now()-m.lastExport)/86400000);
}
function renderExportNudge(){
  const el=document.getElementById('export-nudge'); if(!el) return;
  const m=loadMeta(); const today=ymd();
  const exportedToday = m.lastExport && ymd(new Date(m.lastExport))===today;
  const dismissedToday = m.nudgeDay===today;
  if(exportedToday || dismissedToday){ el.innerHTML=''; return; }
  const d=daysSinceExport();
  const msg = d===null ? '今天还没备份（也还没导出过）。' : '今天还没备份，建议每天导出一份 JSON。';
  el.innerHTML='<div style="border:1px solid var(--amber);background:var(--surface-2);border-radius:var(--radius);'+
    'padding:9px 13px;margin-bottom:16px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--amber)">'+
    '<span>⚠ '+msg+'</span>'+
    '<button class="btn sm primary" data-action="export" style="margin-left:auto">立即导出</button>'+
    '<button class="btn sm ghost" data-action="dismiss-nudge">知道了</button></div>';
}

/* ===== theme ===== */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelector('meta[name=theme-color]').setAttribute('content', t==='pixel'?'#0E141B':'#F1EEE2');
  document.querySelectorAll('#themeToggle button').forEach(b=>b.classList.toggle('on',b.dataset.themeSet===t));
  try{ localStorage.setItem(THEME_KEY,t); }catch(e){}
}
applyTheme((()=>{ try{ return localStorage.getItem(THEME_KEY)||'pixel'; }catch(e){ return 'pixel'; } })());
document.getElementById('themeToggle').addEventListener('click',e=>{
  const b=e.target.closest('[data-theme-set]'); if(b) applyTheme(b.dataset.themeSet);
});

function renderAvatar(){
  const el=document.getElementById('avatar'); if(!el) return;
  let img=null; try{ img=localStorage.getItem(AVA_KEY); }catch(e){}
  el.innerHTML = img ? '<img src="'+img+'" alt="头像">' : DEFAULT_AVATAR;
}
document.getElementById('avatar').addEventListener('click',()=>{ if(window._petDidDrag&&window._petDidDrag()) return; document.getElementById('avatarInput').click(); });
document.getElementById('avatarInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ localStorage.setItem(AVA_KEY,r.result); renderAvatar(); }catch(err){ alert('图片太大，换张小一点的（建议 < 1MB / 像素图最好）。'); } };
  r.readAsDataURL(f); e.target.value='';
});
renderAvatar();

/* pet: opacity + drag-to-move (floating desktop pet) */
const OPA_KEY='wb_avatar_opacity', PET_POS_KEY='wb_pet_pos';
function applyPetOpacity(v){ const el=document.getElementById('avatar'); if(el) el.style.opacity=(v/100); }
(function initPet(){
  const sl=document.getElementById('petOpacity'); const flo=document.getElementById('petFloat'); const av=document.getElementById('avatar');
  let v=100; try{ const s=localStorage.getItem(OPA_KEY); if(s!=null) v=+s; }catch(e){}
  if(sl){ sl.value=v; }
  applyPetOpacity(v);
  if(sl) sl.addEventListener('input',()=>{ applyPetOpacity(sl.value); try{ localStorage.setItem(OPA_KEY,sl.value); }catch(e){} });
  // restore position (default: top-right corner, out of the way)
  try{ const p=JSON.parse(localStorage.getItem(PET_POS_KEY)); if(p&&flo){ flo.style.left=p.x+'px'; flo.style.top=p.y+'px'; }
    else if(flo){ flo.style.left=Math.max(240,window.innerWidth-150)+'px'; flo.style.top='84px'; } }catch(e){ if(flo){ flo.style.left=(window.innerWidth-150)+'px'; flo.style.top='84px'; } }
  // drag
  let dragging=false,didDrag=false,sx=0,sy=0,ox=0,oy=0;
  function down(e){ const pt=e.touches?e.touches[0]:e; dragging=true; didDrag=false;
    const r=flo.getBoundingClientRect(); ox=r.left; oy=r.top; sx=pt.clientX; sy=pt.clientY;
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up); }
  function move(e){ if(!dragging) return; const pt=e.touches?e.touches[0]:e; const dx=pt.clientX-sx, dy=pt.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4) didDrag=true;
    let nx=Math.max(0,Math.min(window.innerWidth-40,ox+dx)), ny=Math.max(0,Math.min(window.innerHeight-40,oy+dy));
    flo.style.left=nx+'px'; flo.style.top=ny+'px'; if(e.cancelable) e.preventDefault(); }
  function up(){ dragging=false;
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up);
    if(didDrag){ const r=flo.getBoundingClientRect(); try{ localStorage.setItem(PET_POS_KEY,JSON.stringify({x:Math.round(r.left),y:Math.round(r.top)})); }catch(e){} } }
  if(av){ av.addEventListener('mousedown',down); av.addEventListener('touchstart',down,{passive:true}); }
  window._petDidDrag=()=>didDrag;
})();

/* ===== files: IndexedDB with localStorage fallback (works on file://) ===== */
let _idb=null;
function idbOpen(){ return new Promise((res,rej)=>{ if(_idb) return res(_idb);
  const r=indexedDB.open('rh_files',1);
  r.onupgradeneeded=e=> e.target.result.createObjectStore('files',{keyPath:'id'});
  r.onsuccess=e=>{ _idb=e.target.result; res(_idb); };
  r.onerror=()=> rej(r.error);
}); }
function lsFiles(){ try{ return JSON.parse(localStorage.getItem(FILE_LS)||'{}'); }catch(e){ return {}; } }
function lsSet(o){ localStorage.setItem(FILE_LS, JSON.stringify(o)); }
function toBase64(buf){ const b=new Uint8Array(buf); let s=''; const c=0x8000;
  for(let i=0;i<b.length;i+=c) s+=String.fromCharCode.apply(null,b.subarray(i,i+c)); return btoa(s); }
async function filePut(id,file){
  try{ const db=await idbOpen();
    await new Promise((res,rej)=>{ const t=db.transaction('files','readwrite');
      t.objectStore('files').put({id,blob:file,name:file.name,type:file.type});
      t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); return;
  }catch(e){}
  const buf=await file.arrayBuffer();
  const all=lsFiles(); all[id]={name:file.name,type:file.type,data:toBase64(buf)}; lsSet(all);
}
async function fileGet(id){
  try{ const db=await idbOpen();
    const rec=await new Promise((res,rej)=>{ const t=db.transaction('files','readonly');
      const r=t.objectStore('files').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    if(rec&&rec.blob) return rec.blob;
  }catch(e){}
  const all=lsFiles(); const rec=all[id]; if(!rec) return null;
  const bin=atob(rec.data); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:rec.type});
}
async function fileDel(id){
  try{ const db=await idbOpen();
    await new Promise(res=>{ const t=db.transaction('files','readwrite');
      t.objectStore('files').delete(id); t.oncomplete=()=>res(); }); }catch(e){}
  const all=lsFiles(); if(all[id]){ delete all[id]; lsSet(all); }
}
async function downloadFile(fileId,name){
  const blob=await fileGet(fileId); if(!blob){ alert('文件无法读取'); return; }
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ===== todo helpers ===== */
function badgeOf(t){
  if(!t.done) return '';
  if(t.scope==='week'){
    let onTime=(t.doneAt-(t.createdAt||t.doneAt))<=WEEK;
    if(t.ddl){ const end=new Date(t.ddl+'T23:59:59').getTime(); if(t.doneAt>end) onTime=false; }
    return onTime?'<span class="badge ok">一周内完成</span>':'<span class="badge late">超时完成</span>';
  }
  return '<span class="badge ok">已完成</span>';
}
function ddlClass(t){
  if(t.done||!t.ddl) return '';
  const end=new Date(t.ddl+'T23:59:59').getTime(); const d=end-now();
  if(d<0) return 'urgent'; if(d<=3*86400000) return 'urgent'; if(d<=WEEK) return 'soon'; return '';
}

const SCOPE_CLASS={day:'day',week:'week',impnu:'impnu'};
function scopeBadge(s){ return '<span class="badge '+(SCOPE_CLASS[s]||'week')+'">'+(SCOPE_LABEL[s]||'一周内')+'</span>'; }
function todoRow(t){

async function sendChat(){
  const inp=document.getElementById('chat-input'); if(!inp) return;
  const text=inp.value.trim(); if(!text) return;
  inp.value='';
  chatMsgs.push({role:'user',content:text});
  const body=document.getElementById('chat-body');
  if(body) body.innerHTML=chatMsgs.map(m=>'<div class="chat-b '+m.role+'">'+esc(m.content)+'</div>').join('')+'<div class="chat-b ai" id="chat-stream"><span class="muted small">思考中…</span></div>';
  const stream=document.getElementById('chat-stream');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatMsgs.slice()})});
    if(!res.ok||!res.body){ const t=await res.json().catch(()=>({})); if(stream) stream.innerHTML='<span class="muted small">出错：'+(t.error||res.status)+'</span>'; return; }
    const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){ const {done,value}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
      let idx; while((idx=buf.indexOf('\n\n'))>=0){ const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        chunk.split('\n').forEach(line=>{ if(line.startsWith('data: ')){ const data=line.slice(6).trim(); if(data==='[DONE]') return;
          try{ const j=JSON.parse(data); const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content; if(c) appendChat(c); if(j.error) appendChat(' [错误:'+j.error+']'); }catch(e){} } } ); }
    }
    if(stream) stream.removeAttribute('id');
  }catch(e){ if(stream) stream.innerHTML='<span class="muted small">需要后端 /api/chat（部署并配置 Key 后可用）</span>'; }
}

let _masonryRO=null;
function layoutMasonry(grid){
  if(!grid) return; const cs=getComputedStyle(grid); if(cs.display!=='grid') return;
  const rowH=parseFloat(cs.gridAutoRows)||8; const gap=parseFloat(cs.rowGap)||16;
  grid.querySelectorAll('.widget, .web-card').forEach(it=>{
    const h=it.getBoundingClientRect().height; if(!h) return;
    const span=Math.max(1,Math.ceil((h+gap)/(rowH+gap)));
    it.style.gridRowEnd='span '+span;
  });
}
function observeMasonry(grid){
  if(_masonryRO){ _masonryRO.disconnect(); _masonryRO=null; }
  if(!grid || getComputedStyle(grid).display!=='grid') return;
  layoutMasonry(grid);
  if(typeof ResizeObserver==='function'){
    _masonryRO=new ResizeObserver(()=>layoutMasonry(grid));
    grid.querySelectorAll('.widget, .web-card').forEach(it=>_masonryRO.observe(it));
  }
  requestAnimationFrame(()=>layoutMasonry(grid));
  setTimeout(()=>layoutMasonry(grid),300);
}

function attachWidgetDrag(){
  const grid=document.getElementById('widget-grid'); if(!grid) return; let dragged=null;
  grid.querySelectorAll('.widget').forEach(w=>{
    w.addEventListener('dragstart',()=>{ dragged=w; setTimeout(()=>w.classList.add('dragging'),0); });
    w.addEventListener('dragend',()=>{ w.classList.remove('dragging'); dragged=null;
      store.homeLayout=[...grid.querySelectorAll('.widget')].map(x=>x.dataset.wid); save(); });
  });
  grid.addEventListener('dragover',e=>{ e.preventDefault(); if(!dragged) return;
    const after=dragAfter(grid,e.clientX,e.clientY);
    if(after==null) grid.appendChild(dragged); else grid.insertBefore(dragged,after); });
}
function dragAfter(grid,x,y,sel){
  const els=[...grid.querySelectorAll(sel||'.widget:not(.dragging)')];
  let best={d:Infinity,el:null};
  for(const el of els){ const b=el.getBoundingClientRect(); const cx=b.left+b.width/2, cy=b.top+b.height/2;
    if(cy>y-10 || (Math.abs(cy-y)<b.height && cx>x)){ const d=Math.hypot(x-cx,y-cy); if(d<best.d) best={d,el}; } }
  return best.el;
}

function attachWebDrag(){
  const list=document.querySelector('.web-list'); if(!list) return; let dragged=null;
  list.querySelectorAll('.web-card').forEach(card=>{
    const h=card.querySelector('.web-drag');
    let ok=false;
    if(h){ h.addEventListener('mousedown',()=>{ok=true;}); h.addEventListener('touchstart',()=>{ok=true;},{passive:true}); }
    card.addEventListener('dragstart',e=>{ if(!ok){ e.preventDefault(); return; } dragged=card; setTimeout(()=>card.classList.add('wdragging'),0); });
    card.addEventListener('dragend',()=>{ ok=false; card.classList.remove('wdragging'); dragged=null;
      const order=[...list.querySelectorAll('.web-card')].map(c=>c.dataset.webid);
      store.websites.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id)); save(); renderWebsites(); });
  });
  list.addEventListener('dragover',e=>{ e.preventDefault(); if(!dragged) return;
    const after=dragAfter(list,e.clientX,e.clientY,'.web-card:not(.wdragging)');
    if(after==null) list.appendChild(dragged); else list.insertBefore(dragged,after); });
}

/* ===== PREP ===== */
function segBlocks(id,level){
  const col=pctColor(level/3*100);
  let h='<div class="seg">';
  for(let i=1;i<=3;i++) h+='<div class="blk'+(i<=level?' fill':'')+'"'+(i<=level?' style="background:'+col+';border-color:'+col+'"':'')+' data-action="set-prep-level" data-id="'+id+'" data-lvl="'+i+'" title="点到第 '+i+' 级"></div>';
  h+='<span class="lvl">'+level+' / 3</span></div>';
  return h;
}
function renderPrep(){
  const total=store.prep.length; const sum=store.prep.reduce((s,p)=>s+p.level,0);

function initToolkit(){
  /* finance */
  const fmt=n=>isFinite(n)?n.toLocaleString('zh-CN',{maximumFractionDigits:2}):'—';
  const finCalc=()=>{
    const mode=document.getElementById('tk-fin-mode').value;
    const P=+document.getElementById('tk-fin-p').value, r=(+document.getElementById('tk-fin-r').value)/100, n=+document.getElementById('tk-fin-n').value;
    const l1=document.getElementById('tk-fin-l1'); let out='—';
    if(mode==='fv'){ l1.textContent='本金 P'; out='终值 = '+fmt(P*Math.pow(1+r,n)); }
    else if(mode==='pv'){ l1.textContent='终值 F'; out='现值 = '+fmt(P/Math.pow(1+r,n)); }
    else { l1.textContent='每期存入 A'; const fv=r===0?P*n:P*(Math.pow(1+r,n)-1)/r; out='年金终值 = '+fmt(fv); }
    document.getElementById('tk-fin-out').textContent=out;
  };
  ['tk-fin-mode','tk-fin-p','tk-fin-r','tk-fin-n'].forEach(id=>{ const e=document.getElementById(id); if(e){ e.addEventListener('input',finCalc); e.addEventListener('change',finCalc);} }); finCalc();
  /* percent */
  const pctCalc=()=>{ const a=+document.getElementById('tk-pct-a').value, b=+document.getElementById('tk-pct-b').value;
    document.getElementById('tk-pct-out').innerHTML='B 是 A 的 <b style="color:var(--accent)">'+fmt(a?b/a*100:0)+'%</b> · A 的 B% = <b style="color:var(--accent)">'+fmt(a*b/100)+'</b> · A→B 变化 <b style="color:var(--accent)">'+fmt(a?(b-a)/a*100:0)+'%</b>'; };
  ['tk-pct-a','tk-pct-b'].forEach(id=>document.getElementById(id).addEventListener('input',pctCalc)); pctCalc();
  /* date */
  const da=document.getElementById('tk-date-a'), db=document.getElementById('tk-date-b'); da.value=todayStr();
  const dCalc=()=>{ if(!da.value||!db.value){ document.getElementById('tk-date-out').textContent='选两个日期'; return; }
    const diff=Math.round((new Date(db.value)-new Date(da.value))/86400000);
    document.getElementById('tk-date-out').innerHTML='相差 <b style="color:var(--accent)">'+Math.abs(diff)+'</b> 天'+(diff<0?'（止在起之前）':diff>0?'（还有 '+diff+' 天）':'（同一天）'); };
  da.addEventListener('change',dCalc); db.addEventListener('change',dCalc); dCalc();
  /* word count */
  const wcIn=document.getElementById('tk-wc-in');
  const wcCalc=()=>{ const t=wcIn.value; const words=(t.trim().match(/[A-Za-z0-9']+/g)||[]).length;
    const cn=(t.match(/[\u4e00-\u9fa5]/g)||[]).length; const sent=(t.match(/[.!?。！？]/g)||[]).length;
    document.getElementById('tk-wc-out').textContent='字符 '+t.length+' · 词 '+words+' · 中文字 '+cn+' · 句 '+(sent||(t.trim()?1:0)); };
  wcIn.addEventListener('input',wcCalc);
  /* pomodoro */
  const disp=document.getElementById('tk-pomo-disp');
  const setDisp=s=>{ disp.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
  document.getElementById('tk-pomo-start').addEventListener('click',()=>{ if(_pomoTimer) return;
    _pomoTimer=setInterval(()=>{ if(_pomoLeft<=0){ clearInterval(_pomoTimer); _pomoTimer=null; disp.style.color='var(--green)'; try{new Audio().play()}catch(e){}
      if(_pomoPreset>=15){ store.focusLog=store.focusLog||[]; store.focusLog.push({at:now(),min:_pomoPreset}); if(store.focusLog.length>400) store.focusLog=store.focusLog.slice(-400); save(); }
      return; } _pomoLeft--; setDisp(_pomoLeft); },1000); });
  document.getElementById('tk-pomo-pause').addEventListener('click',()=>{ if(_pomoTimer){ clearInterval(_pomoTimer); _pomoTimer=null; } });
  document.querySelectorAll('[data-pomo]').forEach(b=>b.addEventListener('click',()=>{ if(_pomoTimer){clearInterval(_pomoTimer);_pomoTimer=null;} _pomoPreset=(+b.dataset.pomo); _pomoLeft=_pomoPreset*60; disp.style.color=''; setDisp(_pomoLeft); }));
  setDisp(_pomoLeft);
  /* json */
  const jIn=document.getElementById('tk-json-in'), jOut=document.getElementById('tk-json-out');
  const jRun=(min)=>{ try{ const o=JSON.parse(jIn.value); jIn.value=JSON.stringify(o,null,min?0:2); jOut.style.color='var(--green)'; jOut.textContent='✓ 合法 JSON，已'+(min?'压缩':'格式化'); }catch(e){ jOut.style.color='var(--red)'; jOut.textContent='✕ '+e.message; } };
  document.getElementById('tk-json-fmt').addEventListener('click',()=>jRun(false));
  document.getElementById('tk-json-min').addEventListener('click',()=>jRun(true));
  const jName=document.getElementById('tk-json-name'); if(jName) jName.value=todayStr().replace(/-/g,'')+'_日记';
  const jDl=document.getElementById('tk-json-dl'); if(jDl) jDl.addEventListener('click',()=>{
    const raw=jIn.value||''; let ext='.txt'; try{ JSON.parse(raw); ext='.json'; }catch(e){}
    let name=(jName.value||'未命名').trim(); if(!/\.[a-z0-9]+$/i.test(name)) name+=ext;
    const blob=new Blob([raw],{type:'text/plain'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
    jOut.style.color='var(--green)'; jOut.textContent='✓ 已下载 '+name;
  });
}

  return '<div class="progbar"><div class="progbar-fill" style="width:'+pct+'%;background:'+col+'"></div></div>'; }

/* ===== REVIEW & HABITS (FR-21 daily loop) ===== */
function ymd(dt){ dt=dt||new Date(); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function habitDone(h,d){ return (h.log||[]).indexOf(d||ymd())>=0; }
function habitStreak(h){ const set=new Set(h.log||[]); let n=0; const cur=new Date(); cur.setHours(0,0,0,0);
  if(!set.has(ymd(cur))) cur.setDate(cur.getDate()-1);
  while(set.has(ymd(cur))){ n++; cur.setDate(cur.getDate()-1); } return n; }
function habitDots(h){ let s=''; const t0=new Date(); t0.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){ const d=new Date(t0); d.setDate(d.getDate()-i); s+='<span class="hdot'+(habitDone(h,ymd(d))?' on':'')+'" title="'+ymd(d)+'"></span>'; } return s; }

/* ===== DATA / stats (pure SVG) ===== */
function radarSVG(items){
  const n=items.length; const size=300,cx=150,cy=150,R=95,maxv=3;
  if(n<3) return '<div class="muted small" style="padding:20px">准备项满 3 个才画雷达图，去「投递准备」加。</div>';
  let rings=''; for(let r=1;r<=3;r++){ const rr=R*r/3; let pts=[]; for(let i=0;i<n;i++){ const a=(-90+i*360/n)*Math.PI/180; pts.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1)); } rings+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="var(--border)" stroke-width="1"/>'; }
  let axes='',labels='';
  for(let i=0;i<n;i++){ const a=(-90+i*360/n)*Math.PI/180; const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>';
    const lx=cx+(R+20)*Math.cos(a), ly=cy+(R+20)*Math.sin(a);
    labels+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="9" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">'+esc(items[i].name.slice(0,7))+'</text>'; }
  let dpts=[]; for(let i=0;i<n;i++){ const a=(-90+i*360/n)*Math.PI/180; const v=(items[i].level||0)/maxv; dpts.push((cx+R*v*Math.cos(a)).toFixed(1)+','+(cy+R*v*Math.sin(a)).toFixed(1)); }
  const poly='<polygon points="'+dpts.join(' ')+'" fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-width="2"/>';
  let dots=''; for(let i=0;i<n;i++){ const a=(-90+i*360/n)*Math.PI/180; const v=(items[i].level||0)/maxv; dots+='<circle cx="'+(cx+R*v*Math.cos(a)).toFixed(1)+'" cy="'+(cy+R*v*Math.sin(a)).toFixed(1)+'" r="3" fill="var(--accent)"/>'; }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:300px;display:block;margin:0 auto">'+rings+axes+poly+dots+labels+'</svg>';
}
function barsSVG(data,color){
  const n=data.length||1; const w=Math.max(300,n*24), h=150, base=h-26, top=14;
  const max=Math.max(1,...data.map(d=>d.value));
  let bars=''; data.forEach((d,i)=>{ const cxx=(i+0.5)*(w/n); const bw=(w/n)*0.56; const bh=(base-top)*(d.value/max); const y=base-bh;
    bars+='<rect x="'+(cxx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" rx="1.5" fill="'+color+'"/>';
    if(d.value>0) bars+='<text x="'+cxx.toFixed(1)+'" y="'+(y-3).toFixed(1)+'" font-size="8" fill="var(--muted)" text-anchor="middle">'+d.value+'</text>';
    if(d.label) bars+='<text x="'+cxx.toFixed(1)+'" y="'+(h-6)+'" font-size="7.5" fill="var(--faint)" text-anchor="middle">'+esc(d.label)+'</text>'; });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%">'+bars+'<line x1="0" y1="'+base+'" x2="'+w+'" y2="'+base+'" stroke="var(--border)" stroke-width="1"/></svg>';
}
function lastNDaysCompletions(N){ const out=[]; const t0=new Date(); t0.setHours(0,0,0,0);
  for(let i=N-1;i>=0;i--){ const d=new Date(t0); d.setDate(d.getDate()-i); const s=d.getTime(),e=s+86400000;
    out.push({label:(d.getMonth()+1)+'/'+d.getDate(), value:store.todos.filter(t=>t.done&&t.doneAt>=s&&t.doneAt<e).length}); } return out; }
function last7Focus(){ const out=[]; const t0=new Date(); t0.setHours(0,0,0,0); const W=['日','一','二','三','四','五','六'];
  for(let i=6;i>=0;i--){ const d=new Date(t0); d.setDate(d.getDate()-i); const s=d.getTime(),e=s+86400000;
    const min=(store.focusLog||[]).filter(f=>f.at>=s&&f.at<e).reduce((a,f)=>a+(f.min||0),0);
    out.push({label:W[d.getDay()], value:min}); } return out; }
function statCard(eyebrow,title,inner){
  return '<div class="card" style="margin-bottom:14px"><div class="eyebrow" style="margin-bottom:4px">'+eyebrow+'</div>'+
    '<div style="font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--ink);margin-bottom:12px">'+title+'</div>'+inner+'</div>';
}
function renderStats(){
  const prep=store.prep||[];
  const prepPct=prep.length? Math.round(prep.reduce((s,p)=>s+p.level,0)/(prep.length*3)*100):0;
  const trend=lastNDaysCompletions(14); const doneTotal=trend.reduce((a,d)=>a+d.value,0);
  const focus=last7Focus(); const focusTotal=focus.reduce((a,d)=>a+d.value,0);
  const projects=(store.togo||[]);
  const projInner = projects.length? projects.map(p=>{ const g=togoProg(p);
      return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>'+esc(p.title)+' <span class="tiny">· '+esc(p.status)+'</span></span><span class="tiny" style="color:'+pctColor(g.pct)+'">'+g.pct+'% ('+g.d+'/'+g.t+')</span></div>'+progBar(g.pct)+'</div>'; }).join('')
    : '<div class="muted small">还没有项目，去「待办 & 随想」建一个。</div>';
  const grid=
    statCard('PREP · 准备度雷达','各项练到哪（0–3 级） · 总体 '+prepPct+'%', radarSVG(prep))+
    statCard('TASKS · 完成趋势','近 14 天完成的待办 · 共 '+doneTotal+' 件', barsSVG(trend,'var(--accent)'))+
    statCard('FOCUS · 本周专注','番茄钟累计分钟 · 本周 '+focusTotal+' 分钟'+(focusTotal===0?'（去工具箱用番茄钟就会累计）':''), barsSVG(focus,'var(--pink)'))+
    statCard('PROJECTS · 项目进度','按子任务完成度', projInner);
  document.getElementById('view-stats').innerHTML=
    '<div class="view-head"><div class="titlewrap"><span class="eyebrow">06 / DATA</span></div></div>'+
    '<div class="stats-grid">'+grid+'</div>';
}

function tickClock(){
  const d=new Date();
  const t=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
  const tShort=[d.getHours(),d.getMinutes()].map(n=>String(n).padStart(2,'0')).join(':');
  const c=document.getElementById('clock'); if(c) c.textContent=tShort;
  const sc=document.getElementById('side-clock'); if(sc) sc.textContent=t;
  const hd=document.getElementById('hud-date'); if(hd) hd.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
  const sd=document.getElementById('side-date'); if(sd) sd.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
}
function startClock(){ if(_clockTimer) clearInterval(_clockTimer); tickClock(); _clockTimer=setInterval(tickClock,1000); }

/* ===== actions ===== */
function handleClick(btn){
  const a=btn.dataset.action;
  switch(a){
    case 'goto': switchView(btn.dataset.view); break;
    case 'shuffle-quote': { const n=(store.quotes||[]).length; if(n>1){ let r; do{ r=Math.floor(Math.random()*n); }while(r===_quoteIdx&&n>1); _quoteIdx=r; renderWorkbench(); } break; }
    case 'toggle-home-edit': _homeEdit=!_homeEdit; renderWorkbench(); break;
    case 'remove-widget': { if(btn.dataset.wid==='weather') store.weatherDismissed=true; store.homeLayout=homeLayout().filter(id=>id!==btn.dataset.wid); save(); renderWorkbench(); break; }
    case 'add-widget': { const l=homeLayout(); if(l.indexOf(btn.dataset.wid)<0){ l.push(btn.dataset.wid); store.homeLayout=l; save(); } closeModal(); renderWorkbench(); break; }
    case 'reset-home': if(confirm('恢复主页默认布局？')){ store.homeLayout=DEFAULT_HOME.slice(); save(); renderWorkbench(); } break;
    case 'wthr-go': { const inp=document.getElementById('wthr-city'); const c=(inp&&inp.value||'').trim(); if(c){ store.weatherCity=c; save(); loadWeather(); } break; }
    case 'feed-add': { const i=document.getElementById('feed-src'); const v=(i&&i.value||'').trim(); if(v){ store.feedSources.push({id:uid(),url:v}); save(); renderWorkbench(); } break; }
    case 'feed-del': { store.feedSources=store.feedSources.filter(s=>s.id!==btn.dataset.id); save(); renderWorkbench(); break; }
    case 'feed-refresh': { loadFeed(); break; }
    case 'feed-summary': { feedSummary(); break; }
    case 'daily-refresh': { loadDaily(); break; }
    case 'daily-summary': { dailySummary(); break; }
    case 'inspire-refresh': { const ib=document.getElementById('inspire-body'); if(ib) ib.innerHTML=renderInspireItems(); break; }
    case 'inspire-chat': { const t=btn.dataset.topic; if(t) openChatWith(t); break; }
    case 'inspire-doubao': { const t=btn.dataset.topic; if(t) openExternalDoubao(t,btn); break; }
    case 'chat-send': { sendChat(); break; }
    case 'chat-clear': { chatMsgs=[]; const b=document.getElementById('chat-body'); if(b) b.innerHTML='<span class="muted small">和 AI 随便聊聊（部署并配置 Key 后可用）</span>'; break; }
    case 'open-add-widget': openAddWidget(); break;
    case 'card-style': openCardStyle(btn.dataset.key, btn.dataset.w==='1'); break;
    case 'card-style-reset': { delete store.cardStyle[btn.dataset.key]; save(); closeModal(); refresh(); break; }
    case 'add-quote': openForm('加一句鼓励语',[{name:'text',label:'写给自己的话',type:'textarea',placeholder:'如：你被允许安静下来。'}],
      v=>{ if((v.text||'').trim()){ store.quotes.push(v.text.trim()); _quoteIdx=store.quotes.length-1; save(); renderWorkbench(); } }); break;
    case 'del-todo': store.todos=store.todos.filter(t=>t.id!==btn.dataset.id); save(); refresh(); break;
    case 'add-web': openForm('添加网站',[
      {name:'name',label:'名称',placeholder:'我的项目'},{name:'url',label:'链接',placeholder:'https://...'},
